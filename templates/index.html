<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PyOlympiad | Kakatiya Olympiad School</title>
<link rel="icon" href="https://i.ibb.co/j9JrF3R5/Vibrant-Gradient-Ribbon-M-Logo.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --green: #10a37f;
    --green-dark: #0b8f70;
    --blue: #3776ab;
    --background: #f6f7f9;
    --white: #ffffff;
    --border: #e5e7eb;
    --border-light: #eeeeee;
    --text: #202124;
    --muted: #9ca3af;
    --error: #dc2626;
    --editor-background: #ffffff;
    --console-background: #fbfbfc;
    --surface: #ffffff;
    --header-height: 58px;
    --panel-header: 43px;
    --splitter: 10px;
    --code-font: 14px;
    --code-lh: 22px;

    /* Terminal palette */
    --term-bg: #0d1117;
    --term-bar: #161b22;
    --term-line: #21262d;
    --term-line-2: #30363d;
    --term-text: #c9d1d9;
    --term-bright: #e6edf3;
    --term-dim: #8b949e;
    --term-green: #3fb950;
    --term-blue: #58a6ff;
    --term-red: #f85149;
}

html, body { height: 100%; }

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
}
body.dragging { user-select: none; -webkit-user-select: none; }
body.dragging.col { cursor: col-resize; }
body.dragging.row { cursor: row-resize; }

/* ================= HEADER ================= */
.topbar {
    height: var(--header-height);
    flex-shrink: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    gap: 10px;
    position: relative; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo {
    width: 40px; height: 40px; flex-shrink: 0;
    object-fit: contain;
    background: none; border: none; border-radius: 0;
    display: block;
}
.brand-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-name { font-size: 16px; font-weight: 650; color: #202124; white-space: nowrap; }
.brand-subtitle { font-size: 11px; color: var(--muted); white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.header-back-button {
    display: none;
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: #374151;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
}
.header-back-button svg { width: 22px; height: 22px; }
.header-back-button:hover { background: #f0f0f0; }

.language {
    height: 34px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 7px; background: white;
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: #4b5563; white-space: nowrap;
}
.python-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }

.run-controls { display: flex; align-items: center; }
.run-icon { line-height: 1; }

.run-button, .stop-button {
    height: 36px; border: none; border-radius: 7px; color: white;
    padding: 0 17px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: 0.15s ease;
}
.run-button { background: var(--green); }
.run-button:hover { background: var(--green-dark); }
.run-button:disabled { opacity: 0.65; cursor: not-allowed; }
.stop-button { background: #ef4444; display: none; }
.stop-button:hover { background: #dc2626; }
.stop-button.visible { display: flex; }
.run-button.hidden { display: none; }

button:focus-visible, .splitter:focus-visible, .error-link:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
}

/* ================= WORKSPACE ================= */
.workspace {
    flex: 1; min-height: 0;
    display: flex; flex-direction: row;
    overflow: hidden;
}

/* ================= EDITOR ================= */
.editor-section {
    flex: 1 1 0;
    min-width: 0; min-height: 0;
    background: var(--editor-background);
    display: flex; flex-direction: column;
}
/* Multi-file editor tabs */
.file-tabs {
    display: flex;
    align-items: stretch;
    gap: 4px;
    min-height: 39px;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
    scrollbar-width: thin;
}
.file-tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 7px 7px 0 0;
    background: #f7f7f8;
    color: #4b5563;
    padding: 7px 10px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 13px;
}
.file-tab.active {
    background: var(--surface);
    color: #111827;
    font-weight: 600;
}
.file-tab-add {
    min-width: 34px;
    width: 34px;
    padding: 0;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
}
.file-tab-close {
    border: 0;
    background: transparent;
    color: #9ca3af;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 1px 2px;
    border-radius: 4px;
}
.file-tab-close:hover { background: #e5e7eb; color: #374151; }
.editor-toolbar {
    height: var(--panel-header); flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 13px; gap: 10px;
    position: relative;
}
.file-name { display: none; }
.toolbar-buttons {
    display: flex; gap: 7px; min-width: 0;
    padding-right: 48px;
    overflow: visible;
    scrollbar-width: none;
}
.toolbar-buttons::-webkit-scrollbar { display: none; }
.toolbar-buttons > * { flex-shrink: 0; }

.tool-button {
    height: 29px; border: 1px solid var(--border); border-radius: 6px;
    background: white; padding: 0 10px; font-size: 12px; color: #6b7280;
    cursor: pointer; transition: 0.15s; white-space: nowrap;
    font-family: inherit;
}
.tool-button:hover { background: #f7f7f8; color: #374151; }

.editor-menu { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); flex-shrink: 0; z-index: 20; }
.menu-button { min-width: 38px; padding: 0 9px; font-size: 17px; line-height: 1; }

/* Flat bordered dropdown (no box-shadow anywhere on the page) */
.editor-menu-panel {
    display: none; position: absolute; top: calc(100% + 7px); right: 0; z-index: 1000;
    width: 190px; padding: 6px; background: #fff; border: 1px solid var(--border);
    border-radius: 9px;
}
.editor-menu-panel.open { display: block; }
.menu-item {
    width: 100%; border: 0; border-radius: 6px; background: transparent; padding: 9px 10px;
    text-align: left; font: inherit; font-size: 12px; color: #374151; cursor: pointer;
}
.menu-item:hover { background: #f3f4f6; }
.menu-reset { color: #b91c1c; }
.menu-reset:hover { background: #fef2f2; }
.menu-divider { height: 1px; margin: 5px 2px; background: var(--border); }
.menu-label { padding: 5px 10px 3px; font-size: 11px; color: #9ca3af; }
.menu-font-buttons { display: flex; gap: 4px; }
.menu-font { flex: 1; font-size: 11px; }
.hidden-control { display: none !important; }
.font-buttons { display: flex; gap: 4px; }
.font-buttons .tool-button { width: 30px; padding: 0; font-weight: 600; }
.lbl-short { display: none; }

/* Submenu trigger row: label + chevron, highlights while open */
.menu-item-with-sub {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.menu-chev { color: #9ca3af; font-size: 14px; line-height: 1; flex-shrink: 0; }
.menu-item.submenu-open { background: #f3f4f6; }
.menu-item.submenu-open .menu-chev { color: #374151; }

/* =========================================================
   INSTALLED LIBRARIES — simple panel
   - Opens ONLY when the "Installed Libraries" item is clicked
     (never on hover)
   - Same look as the dropdown: white, thin border, plain rows
   - Closes on: outside click, Esc, menu close, or clicking
     the item again
   ========================================================= */
.lib-flyout {
    display: none;
    position: absolute;
    top: -7px;
    right: calc(100% + 8px);
    width: 210px;
    max-width: calc(100vw - 36px);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 6px;
    flex-direction: column;
    text-align: left;
}
.lib-flyout.open { display: flex; }

.lib-flyout-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 5px 10px 4px;
}
.lib-flyout-title { font-size: 11px; color: #9ca3af; white-space: nowrap; }
.lib-flyout-count { font-size: 11px; color: #9ca3af; white-space: nowrap; }

.lib-flyout-list {
    max-height: 220px;
    overflow-y: auto;
    display: flex; flex-direction: column;
    scrollbar-width: thin;
    scrollbar-color: #d1d5db transparent;
}
.lib-flyout-list::-webkit-scrollbar { width: 6px; }
.lib-flyout-list::-webkit-scrollbar-track { background: transparent; }
.lib-flyout-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

/* Each library = one plain row, same size/feel as .menu-item */
.lib-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 6px;
    font-size: 12px; color: #374151;
}
.lib-row:hover { background: #f3f4f6; }
.lib-name {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lib-ver { flex-shrink: 0; font-size: 11px; color: #9ca3af; }
.lib-remove {
    flex-shrink: 0;
    width: 20px; height: 20px; border: 0; border-radius: 5px;
    background: transparent; color: #9ca3af;
    font-size: 14px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
}
.lib-remove:hover { background: #fef2f2; color: #dc2626; }
.lib-remove:disabled { opacity: .5; cursor: not-allowed; }
.lib-empty { padding: 12px 10px; color: #9ca3af; font-size: 12px; }

/* Footer row behaves like a normal menu item */
.lib-flyout-footer {
    width: 100%; border: 0; border-radius: 6px; background: transparent;
    padding: 9px 10px; text-align: left;
    font: inherit; font-size: 12px; color: #374151; cursor: pointer;
}
.lib-flyout-footer:hover { background: #f3f4f6; }

/* Narrow screens: drop the panel BELOW the dropdown instead of beside it */
@media (max-width: 520px) {
    .lib-flyout { top: calc(100% + 8px); right: 0; }
    .lib-flyout-list { max-height: 150px; }
}

.editor-container { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.editor {
    position: absolute; inset: 0;
    display: flex; overflow: hidden;
    font-family: "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: var(--code-font); line-height: var(--code-lh);
}
.line-numbers {
    width: 54px; flex-shrink: 0; padding-top: 14px;
    background: #fafafa; border-right: 1px solid #eeeeee;
    color: #9ca3af; text-align: right; padding-right: 13px; padding-bottom: 14px;
    user-select: none; overflow: hidden;
}
.line-number { height: var(--code-lh); font-size: calc(var(--code-font) - 1px); }
.line-number.current { color: #374151; font-weight: 600; }
.line-number.error { color: var(--error); font-weight: 700; }
.line-number.error::before { content: "● "; font-size: 8px; vertical-align: middle; }

.code-area { flex: 1; min-width: 0; position: relative; }

#highlightLayer,
#codeEditor {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    margin: 0;
    padding: 14px 18px;
    border: none; outline: none;
    font-family: "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: var(--code-font);
    line-height: var(--code-lh);
    letter-spacing: normal;
    tab-size: 4;
    white-space: pre;
    word-wrap: normal;
    overflow: auto;
}
#highlightLayer {
    background: white;
    color: #1f2937;
    pointer-events: none;
    scrollbar-width: none;
}
#highlightLayer::-webkit-scrollbar { display: none; }
#highlightLayer code {
    font: inherit; background: none; padding: 0; margin: 0;
    white-space: inherit; display: block; text-shadow: none;
}
#codeEditor {
    resize: none;
    background: transparent;
    color: transparent;
    caret-color: #111827;
}
#codeEditor::selection { background: rgba(16, 163, 127, 0.22); }
#codeEditor::placeholder { color: #b4b8bd; }

/* Flat bordered find bar (no box-shadow) */
.editor-search {
    display: none;
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 15;
    align-items: center;
    gap: 5px;
    padding: 5px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
}
.editor-search.open { display: flex; }
.editor-search input {
    width: 180px; height: 28px;
    border: 1px solid #d8dce1; border-radius: 5px;
    outline: none; padding: 0 8px;
    font: 12px Inter, Arial, sans-serif; color: #202124;
}
.editor-search input:focus { border-color: var(--green); }
.editor-search button {
    width: 28px; height: 28px; border: 1px solid var(--border);
    border-radius: 5px; background: #fff; color: #6b7280; cursor: pointer;
}
.editor-search button:hover { background: #f7f7f8; color: #374151; }
.search-count { min-width: 38px; text-align: center; font-size: 10px; color: #9ca3af; }
.token.comment                       { color: #8b949e; font-style: italic; }
.token.string, .token.triple-quoted-string,
.token.char                          { color: #0a7d5a; }
.token.number, .token.boolean        { color: #c2410c; }
.token.keyword                       { color: #7c3aed; font-weight: 500; }
.token.builtin, .token.class-name    { color: #0369a1; }
.token.function                      { color: #2563eb; }
.token.decorator, .token.annotation  { color: #b45309; }
.token.operator, .token.punctuation  { color: #4b5563; }
.token.interpolation .token.interpolation-punctuation { color: #c2410c; }

/* Show operators exactly as typed (>= stays >=, not a single "≥" ligature) */
.editor, #highlightLayer, #highlightLayer code, #codeEditor, .output-console, .input-field, .input-prompt {
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "calt" 0, "clig" 0;
    -webkit-font-feature-settings: "liga" 0, "calt" 0, "clig" 0;
}

.editor-status {
    height: 30px; flex-shrink: 0;
    border-top: 1px solid var(--border); background: white;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; color: #8a8f98; font-size: 11px; gap: 10px;
    white-space: nowrap; overflow: hidden;
}
.status-group { display: flex; align-items: center; gap: 12px; }

/* ================= SPLITTER ================= */
.splitter {
    flex: 0 0 var(--splitter);
    background: var(--border-light);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    cursor: col-resize;
    position: relative;
    touch-action: none;
    z-index: 5;
    transition: background 0.15s;
}
.splitter::before { content: ""; position: absolute; inset: 0 -7px; }
.splitter::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 3px; height: 28px;
    transform: translate(-50%, -50%);
    border-radius: 2px; background: #c4c9d0;
}
.splitter:hover, .splitter.active { background: rgba(16, 163, 127, 0.18); }
.splitter:hover::after, .splitter.active::after { background: var(--green); }

/* ================= RIGHT SECTION (SHELL) ================= */
.right-section {
    flex: 0 0 38%;
    min-width: 0; min-height: 0;
    background: var(--console-background);
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;   /* anchors the package terminal layer */
}

.input-section {
    display: none; background: white;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    max-height: 50%;
    flex-direction: column;
}
.input-section.visible { display: flex; }
.input-header {
    height: 42px; flex-shrink: 0;
    border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
}
.input-header-right { display: flex; align-items: center; gap: 10px; }
.input-title { font-size: 13px; font-weight: 600; color: #374151; }
.input-status { font-size: 11px; color: #f59e0b; }
.input-body { padding: 12px 14px 14px; overflow-y: auto; min-height: 0; }
.input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.input-row:last-child { margin-bottom: 0; }
.input-prompt {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: #374151; max-width: 55%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.input-history-value {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: #0a7d5a;
    flex: 1; min-width: 80px; height: 32px;
    display: flex; align-items: center; padding: 0 9px;
}
.input-field {
    flex: 1; min-width: 80px; height: 32px;
    border: 1px solid #d8dce1; border-radius: 6px; outline: none;
    padding: 0 9px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: #202124; background: white;
}
.input-field:focus {
    border-color: var(--green);   /* flat focus, no shadow */
}

.output-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.output-header {
    height: var(--panel-header); flex-shrink: 0; background: white;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 14px; gap: 8px;
}
.output-title { font-size: 13px; font-weight: 600; color: #374151; }
.output-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.output-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9ca3af; white-space: nowrap; }
.small-button {
    height: 26px; border: 1px solid var(--border); border-radius: 5px;
    background: white; padding: 0 9px; font-size: 11px; color: #6b7280;
    cursor: pointer; display: none; transition: 0.15s; white-space: nowrap;
}
.small-button.visible { display: inline-block; }
.small-button:hover { background: #f7f7f8; color: #374151; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
.status-dot.ready   { background: #22c55e; }
.status-dot.running { background: #f59e0b; }
.status-dot.error   { background: #ef4444; }

.output-console {
    flex: 1; min-height: 0; overflow: auto; padding: 15px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 21px; color: #374151;
    white-space: pre-wrap; word-break: break-word;
}
.output-placeholder { color: #a1a7af; font-family: Inter, Arial, sans-serif; font-size: 12px; }
.output-error { color: var(--error); white-space: pre-wrap; }
.error-link { color: #b91c1c; text-decoration: underline; cursor: pointer; font-weight: 600; }
.error-link:hover { color: #7f1d1d; }

/* =========================================================
   PACKAGE TERMINAL  (desktop-style, replaces the whole shell)
   ========================================================= */
.pkg-layer {
    position: absolute; inset: 0; z-index: 40;
    display: none;
    background: var(--term-bg);
    font-family: Consolas, "Courier New", monospace;
}
.pkg-layer.open { display: flex; flex-direction: column; }

/* --- Window title bar (desktop chrome) --- */
.pkg-titlebar {
    height: 40px; flex-shrink: 0;
    background: var(--term-bar);
    border-bottom: 1px solid var(--term-line);
    display: flex; align-items: center; gap: 10px;
    padding: 0 10px 0 14px;
    -webkit-user-select: none; user-select: none;
}
.pkg-dots { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.pkg-dots .dot {
    width: 12px; height: 12px; border-radius: 50%;
    display: inline-block; cursor: pointer;
}
.dot-red    { background: #ff5f57; }
.dot-yellow { background: #febc2e; }
.dot-green  { background: #28c840; }
.pkg-title {
    flex: 1; min-width: 0;
    text-align: center;
    font-size: 12px; color: var(--term-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pkg-exit {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border: 0; border-radius: 6px;
    background: transparent;
    color: var(--term-dim);
    font-size: 15px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
}
.pkg-exit:hover { background: var(--term-line-2); color: var(--term-bright); }

/* --- Terminal screen (scrollback) --- */
.pkg-screen {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 12px 14px;
    font-size: 12.5px; line-height: 19px;
    color: var(--term-text);
    white-space: pre-wrap; word-break: break-word;
    font-variant-ligatures: none;
    scrollbar-width: thin;
    scrollbar-color: var(--term-line-2) transparent;
}
.pkg-screen::-webkit-scrollbar { width: 10px; }
.pkg-screen::-webkit-scrollbar-track { background: transparent; }
.pkg-screen::-webkit-scrollbar-thumb {
    background: var(--term-line-2); border-radius: 6px;
    border: 2px solid var(--term-bg);
}
.pkg-screen .t-cmd { color: var(--term-bright); }
.pkg-screen .t-err { color: var(--term-red); }
.pkg-screen .t-dim { color: var(--term-dim); }
.pkg-screen .t-ok  { color: var(--term-green); }
.pkg-screen .p-user { color: var(--term-green); font-weight: 700; }
.pkg-screen .p-path { color: var(--term-blue); }

/* --- Command entry row --- */
.pkg-entry {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--term-line);
    padding: 10px 12px;
    background: var(--term-bg);
}
.pkg-prompt {
    flex-shrink: 0;
    font-size: 12px; font-weight: 700;
    color: var(--term-green);
    white-space: nowrap;
}
.pkg-prompt .p-path { color: var(--term-blue); font-weight: 500; }
.pkg-prompt .p-dollar { color: var(--term-text); font-weight: 500; }
.pkg-input {
    flex: 1; min-width: 0; height: 30px;
    background: transparent;
    border: none; outline: none;
    padding: 0 2px;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--term-bright);
    caret-color: var(--term-green);
}
.pkg-input::placeholder { color: #484f58; }
.pkg-send {
    flex-shrink: 0;
    width: 34px; height: 30px;
    border: 1px solid var(--term-line-2); border-radius: 6px;
    background: var(--term-bar);
    color: var(--term-green);
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    font-family: inherit;
}
.pkg-send:hover { background: var(--term-line); border-color: var(--term-green); }
.pkg-send:disabled { opacity: 0.45; cursor: not-allowed; }

/* ================= TABLET / MOBILE: DEDICATED SHELL SCREEN ================= */
@media (max-width: 850px) {
    .workspace { flex-direction: column; }
    .editor-section { width: 100%; flex: 1 1 0; min-height: 0; display: flex; }
    .splitter { display: none; }
    .right-section { display: none; width: 100%; flex: 1 1 0; background: var(--console-background); }

    /* Activate Shell View */
    body.shell-view .header-back-button { display: flex; }
    body.shell-view .editor-section { display: none; }
    body.shell-view .right-section { display: flex; flex-direction: column; }
    body.shell-view .run-controls { display: none; }

    .input-section.visible { max-height: 40%; flex-shrink: 0; }
    .input-body { max-height: 28vh; }
    .output-section { flex: 1 1 0; min-height: 0; }
}

/* ================= SMALL PHONES ================= */
@media (max-width: 600px) {
    :root { --header-height: 52px; }
    .topbar { padding: 0 11px; }
    .brand-subtitle { font-size: 10px; }
    .brand-name { font-size: 15px; }
    .brand-logo { width: 34px; height: 34px; }
    .language { height: 30px; padding: 0 10px; font-size: 11px; }
    .editor-toolbar { padding: 0 10px; }
    .editor-menu { right: 10px; }
    .toolbar-buttons { padding-right: 44px; }
    .file-tabs { padding: 4px 8px; min-height: 37px; }
    .font-buttons { display: none; }
    .lbl-full { display: none; }
    .lbl-short { display: inline; }
    .line-numbers { width: 40px; padding-right: 8px; padding-bottom: 96px; }
    #highlightLayer, #codeEditor { padding: 14px 10px 96px; }

    /* Round floating Run / Stop button (bottom-right of the editor).
       NOTE: #runControls is moved into .editor-section by JavaScript
       on small screens so this absolute position anchors correctly.
       Flat buttons — no shadows. */
    .editor-section { position: relative; }
    .run-controls {
        position: absolute; right: 16px; bottom: 46px; z-index: 20;
    }
    .run-button, .stop-button {
        width: 58px; height: 58px; padding: 0;
        border-radius: 50%;
    }
    .run-button #runButtonText, .stop-button .run-label { display: none; }
    .run-icon { font-size: 22px; }
    .run-button .run-icon { padding-left: 3px; }
    .run-button:active, .stop-button:active { transform: scale(0.93); }
    .right-section { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .editor-status .hide-sm { display: none; }
    .output-console { padding: 12px; }
    .output-status #statusText { display: none; }

    /* Terminal takes the full shell height, keep title bar compact */
    .pkg-titlebar { height: 36px; padding: 0 8px 0 12px; }
    .pkg-title { font-size: 11px; }
}
@media (max-width: 380px) {
    .brand-name { font-size: 14px; }
    .brand { gap: 8px; }
    .tool-button { padding: 0 8px; }
}

/* ================= SHORT LANDSCAPE SCREENS ================= */
@media (max-height: 480px) and (max-width: 850px) {
    :root { --header-height: 46px; --panel-header: 36px; }
    .editor-status { display: none; }
    .pkg-titlebar { height: 32px; }
}

/* ================= TOUCH DEVICES ================= */
@media (pointer: coarse) {
    .input-field { font-size: 16px; height: 38px; }
    .input-history-value { font-size: 16px; height: 38px; }
    .tool-button, .small-button { height: 34px; }
    :root { --splitter: 14px; }
    .pkg-input { font-size: 16px; height: 36px; }
    .pkg-send { width: 40px; height: 36px; }
    .pkg-exit { width: 30px; height: 30px; }
    .lib-remove { width: 28px; height: 28px; }
}

@media (max-width: 600px) and (max-height: 480px) {
    .run-controls { bottom: 16px; }
    .run-button, .stop-button { width: 48px; height: 48px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* =========================================================

========================================================= */
const ANSI_BASE = [
    "#111827", "#b91c1c", "#15803d", "#a16207",
    "#1d4ed8", "#7e22ce", "#0e7490", "#9ca3af",
];
const ANSI_BRIGHT = [
    "#374151", "#dc2626", "#16a34a", "#d97706",
    "#2563eb", "#9333ea", "#0891b2", "#e5e7eb",
];
const ANSI_CUBE = [0, 95, 135, 175, 215, 255];

function rgbToHex(r, g, b) {
    const c = (v) => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0");
    return "#" + c(r) + c(g) + c(b);
}

function ansi256ToHex(n) {
    if (!Number.isFinite(n)) return null;
    n = Math.max(0, Math.min(255, n | 0));
    if (n < 16)  return n < 8 ? ANSI_BASE[n] : ANSI_BRIGHT[n - 8];
    if (n < 232) {
        const i = n - 16;
        return rgbToHex(
            ANSI_CUBE[Math.floor(i / 36)],
            ANSI_CUBE[Math.floor((i % 36) / 6)],
            ANSI_CUBE[i % 6]
        );
    }
    const g = 8 + (n - 232) * 10;
    return rgbToHex(g, g, g);
}

/* =========================================================
   STATUS / OUTPUT
========================================================= */
function setStatus(type, message) {

/*
 * ANSI / SGR terminal renderer.
 *
 * The parser is deliberately stateful: push() may receive an arbitrary
 * chunk and keeps an incomplete ESC[... sequence until the next chunk.
 * Normal output is ALWAYS inserted with createTextNode/textContent,
 * so stdout/stderr cannot inject HTML into the Shell Output.
 */
class AnsiTerminalRenderer {
    constructor() {
        this.buffer = "";
        this.state = {
            bold: false,
            italic: false,
            underline: false,
            dim: false,
            foreground: null,
            background: null,
        };
    }

    push(chunk) {
        if (chunk === null || chunk === undefined) return document.createDocumentFragment();
        this.buffer += String(chunk);
        return this._parse(false);
    }

    finish() {
        return this._parse(true);
    }

    _parse(flush) {
        const frag = document.createDocumentFragment();
        let text = "";

        const emitText = () => {
            if (!text) return;
            if (this._hasStyle()) {
                const span = document.createElement("span");
                span.style.cssText = this._styleText();
                span.textContent = text;
                frag.appendChild(span);
            } else {
                frag.appendChild(document.createTextNode(text));
            }
            text = "";
        };

        const source = this.buffer;
        let i = 0;

        while (i < source.length) {
            const ch = source[i];

            if (ch !== "\x1b") {
                text += ch;
                i++;
                continue;
            }

            if (i + 1 >= source.length) {
                if (!flush) break;
                i++;
                continue;
            }

            if (source[i + 1] !== "[") {
                i++;
                continue;
            }

            let j = i + 2;
            while (j < source.length && !(source.charCodeAt(j) >= 0x40 && source.charCodeAt(j) <= 0x7e)) {
                j++;
            }

            if (j >= source.length) {
                if (!flush) break;
                i = source.length;
                continue;
            }

            const finalByte = source[j];
            const paramsText = source.slice(i + 2, j);
            emitText();

            if (finalByte === "m") {
                this._applySgr(paramsText);
            }

            i = j + 1;
        }

        if (flush || i > 0) {
            this.buffer = source.slice(i);
        }
        emitText();
        return frag;
    }

    _applySgr(paramsText) {
        let params;
        if (paramsText === "" || paramsText === ";") {
            params = [0];
        } else {
            params = paramsText.split(";").map((v) => {
                const n = parseInt(v, 10);
                return Number.isFinite(n) ? n : 0;
            });
        }

        let i = 0;
        while (i < params.length) {
            const p = params[i];

            if (p === 0) {
                this.state.bold = false;
                this.state.italic = false;
                this.state.underline = false;
                this.state.dim = false;
                this.state.foreground = null;
                this.state.background = null;
            } else if (p === 1) {
                this.state.bold = true;
            } else if (p === 2) {
                this.state.dim = true;
            } else if (p === 3) {
                this.state.italic = true;
            } else if (p === 4) {
                this.state.underline = true;
            } else if (p === 22) {
                this.state.bold = false;
                this.state.dim = false;
            } else if (p === 23) {
                this.state.italic = false;
            } else if (p === 24) {
                this.state.underline = false;
            } else if (p >= 30 && p <= 37) {
                this.state.foreground = ANSI_BASE[p - 30];
            } else if (p === 38 || p === 48) {
                const ext = this._extendedColor(params, i);
                if (ext) {
                    if (p === 38) this.state.foreground = ext.color;
                    else          this.state.background = ext.color;
                    i += ext.skip;
                }
            } else if (p === 39) {
                this.state.foreground = null;
            } else if (p >= 40 && p <= 47) {
                this.state.background = ANSI_BASE[p - 40];
            } else if (p === 49) {
                this.state.background = null;
            } else if (p >= 90 && p <= 97) {
                this.state.foreground = ANSI_BRIGHT[p - 90];
            } else if (p >= 100 && p <= 107) {
                this.state.background = ANSI_BRIGHT[p - 100];
            }

            i++;
        }
    }

    _extendedColor(params, i) {
        const mode = params[i + 1];

        if (mode === 5 && Number.isFinite(params[i + 2])) {
            return { color: ansi256ToHex(params[i + 2]), skip: 2 };
        }

        if (mode === 2 && Number.isFinite(params[i + 4])) {
            return {
                color: rgbToHex(params[i + 2], params[i + 3], params[i + 4]),
                skip: 4,
            };
        }

        return null;
    }

    _hasStyle() {
        const s = this.state;
        return !!(s.bold || s.italic || s.underline || s.dim || s.foreground || s.background);
    }

    _styleText() {
        const s = this.state;
        const parts = [];
        if (s.foreground) parts.push("color:" + s.foreground);
        if (s.background) parts.push("background:" + s.background);
        if (s.bold)       parts.push("font-weight:600");
        if (s.italic)     parts.push("font-style:italic");
        if (s.underline)  parts.push("text-decoration:underline");
        if (s.dim)        parts.push("opacity:0.6");
        return parts.join(";");
    }
}

/* =========================================================
   RESIZABLE LAYOUT (Desktop only)
========================================================= */
const mobileQuery = window.matchMedia("(max-width: 850px)");
const DEFAULT_LAYOUT = { desk: 0.38, mob: 0.40 };
let layout = Object.assign({}, DEFAULT_LAYOUT);

try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY));
    if (saved && typeof saved === "object") Object.assign(layout, saved);
} catch (e) {}

function saveLayout() {
    try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) {}
}
function isMobile() { return mobileQuery.matches; }

function limits(total) {
    const mobile   = isMobile();
    const minRight = mobile ? 120 : 260;
    const minLeft  = mobile ? 140 : 320;
    const sp = splitter.getBoundingClientRect()[mobile ? "height" : "width"] || 10;
    let maxRight = total - minLeft - sp;
    if (maxRight < minRight) maxRight = minRight;
    return { minRight, maxRight };
}

function applyLayout() {
    const rect   = workspace.getBoundingClientRect();
    const mobile = isMobile();

    if (mobile) {
        rightSection.style.flex = "";
        splitter.style.flex = "";
        editorSection.style.flex = "";
        return;
    }

    const total  = rect.width;
    splitter.setAttribute("aria-orientation", "vertical");

    const { minRight, maxRight } = limits(total);
    const frac = layout.desk;
    const px = Math.min(Math.max(frac * total, minRight), maxRight);

    rightSection.style.flex = `0 0 ${px}px`;
    splitter.setAttribute("aria-valuenow", Math.round((px / total) * 100));
}

function setRightSize(px) {
    if (isMobile()) return;
    const rect   = workspace.getBoundingClientRect();
    const total  = rect.width;
    const { minRight, maxRight } = limits(total);
    px = Math.min(Math.max(px, minRight), maxRight);
    layout.desk = px / total;
    applyLayout();
}

let dragging = false;

splitter.addEventListener("pointerdown", (e) => {
    if (isMobile()) return;
    dragging = true;
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("active");
    document.body.classList.add("dragging", "col");
    e.preventDefault();
});

splitter.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = workspace.getBoundingClientRect();
    const sp   = splitter.getBoundingClientRect();
    setRightSize(rect.right - e.clientX - sp.width / 2);
});

function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { splitter.releasePointerCapture(e.pointerId); } catch (err) {}
    splitter.classList.remove("active");
    document.body.classList.remove("dragging", "col");
    saveLayout();
}
splitter.addEventListener("pointerup", endDrag);
splitter.addEventListener("pointercancel", endDrag);

splitter.addEventListener("dblclick", () => {
    if (isMobile()) return;
    layout = Object.assign({}, DEFAULT_LAYOUT);
    applyLayout();
    saveLayout();
});

splitter.addEventListener("keydown", (e) => {
    if (isMobile()) return;
    const rect   = workspace.getBoundingClientRect();
    const total  = rect.width;
    const current = rightSection.getBoundingClientRect().width;
    const step = total * 0.03;
    let handled = true;

    if (e.key === "ArrowLeft")       setRightSize(current + step);
    else if (e.key === "ArrowRight") setRightSize(current - step);
    else handled = false;

    if (e.key === "Home" || e.key === "Enter") {
        layout = Object.assign({}, DEFAULT_LAYOUT);
        applyLayout();
        handled = true;
    }
    if (handled) { e.preventDefault(); saveLayout(); }
});

window.addEventListener("resize", applyLayout);
window.addEventListener("orientationchange", () => setTimeout(applyLayout, 150));
if (mobileQuery.addEventListener) mobileQuery.addEventListener("change", applyLayout);

const FONT_MAX = 26;
let fontSize = isCoarse ? 16 : 14;
try {
    const f = parseInt(localStorage.getItem(FONT_KEY), 10);
