/* =========================================================
   SYNTAX HIGHLIGHTING + GUTTER
========================================================= */
function syncScroll() {
    highlightLayer.scrollTop  = codeEditor.scrollTop;
    highlightLayer.scrollLeft = codeEditor.scrollLeft;
    lineNumbers.scrollTop     = codeEditor.scrollTop;
}

function updateHighlight() {
    let text = codeEditor.value;
    if (text.endsWith("\n")) text += " ";
    highlightCode.textContent = text;
    if (window.Prism) Prism.highlightElement(highlightCode);
    syncScroll();
}

function getCurrentLineNumber() {
    return codeEditor.value.substring(0, codeEditor.selectionStart).split("\n").length;
}

let gutterKey = "";
function renderGutter() {
    const total = codeEditor.value.split("\n").length;
    const cur   = getCurrentLineNumber();
    const key   = total + "|" + cur + "|" + errorLine;
    if (key === gutterKey) return;
    gutterKey = key;

    let html = "";
    for (let i = 1; i <= total; i++) {
        let cls = "line-number";
        if (i === errorLine) cls += " error";
        else if (i === cur)  cls += " current";
        html += `<div class="${cls}">${i}</div>`;
    }
    lineNumbers.innerHTML = html;
    lineNumbers.scrollTop = codeEditor.scrollTop;
}

function updateCursor() {
    const before = codeEditor.value.substring(0, codeEditor.selectionStart);
    const lines  = before.split("\n");
    cursorPosition.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
    const count = codeEditor.value.length;
    charCount.textContent = `${count} character${count === 1 ? "" : "s"}`;
}

function refreshCursor() { renderGutter(); updateCursor(); }

function updateLineNumbers() {
    updateHighlight();
    renderGutter();
    updateCursor();
}

function goToLine(n) {
    const lines = codeEditor.value.split("\n");
    if (n < 1 || n > lines.length) return;
    let start = 0;
    for (let i = 0; i < n - 1; i++) start += lines[i].length + 1;
    const end = start + lines[n - 1].length;
    codeEditor.focus();
    codeEditor.setSelectionRange(start, end);
    const lh = parseFloat(getComputedStyle(codeEditor).lineHeight) || 22;
    codeEditor.scrollTop = Math.max(0, (n - 1) * lh - codeEditor.clientHeight / 3);
    syncScroll();
    refreshCursor();
}

/* =========================================================
   EDIT HELPER (keeps Ctrl+Z / Ctrl+Y working)
========================================================= */
function edit(start, end, text, selStart, selEnd) {
    codeEditor.focus();
    codeEditor.setSelectionRange(start, end);
    let ok = false;
    try {
        if (text === "") {
            if (start === end) return;
            ok = document.execCommand("delete");
        } else {
            ok = document.execCommand("insertText", false, text);
        }
    } catch (e) {}
    if (!ok) {
        codeEditor.setRangeText(text, start, end, "end");
        codeEditor.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (selStart === undefined) selStart = start + text.length;
    if (selEnd === undefined)   selEnd = selStart;
    codeEditor.setSelectionRange(selStart, selEnd);
    refreshCursor();
}

function replaceAll(text) {
    if (isCoarse) {
        codeEditor.value = text;
        codeEditor.dispatchEvent(new Event("input", { bubbles: true }));
        codeEditor.scrollTop = 0;
    } else {
        if (codeEditor.value === "" && text === "") return;
        if (codeEditor.value === "") {
            edit(0, 0, text);
        } else if (text === "") {
            edit(0, codeEditor.value.length, "");
        } else {
            edit(0, codeEditor.value.length, text);
        }
        codeEditor.setSelectionRange(0, 0);
        codeEditor.scrollTop = 0;
    }
    syncScroll();
    refreshCursor();
}

/* =========================================================
   TAB / ENTER EDITING (indent, dedent, auto-indent)
========================================================= */
function handleTabKey(shift) {
    const start = codeEditor.selectionStart;
    const end   = codeEditor.selectionEnd;
    const value = codeEditor.value;

    if (shift) {
        const ls = value.lastIndexOf("\n", start - 1) + 1;
        let le = value.indexOf("\n", end);
        if (le === -1) le = value.length;

        const lines = value.slice(ls, le).split("\n");
        const endLineIdx = value.slice(ls, end).split("\n").length - 1;

        let removedFirst = 0;
        let removedUpToEnd = 0;
        const newLines = [];

        lines.forEach((l, i) => {
            const m = l.match(/^( {1,4}|\t)/);
            const removed = m ? m[0].length : 0;
            if (i === 0) removedFirst = removed;
            if (i <= endLineIdx) removedUpToEnd += removed;
            newLines.push(l.slice(removed));
        });

        const newBlock = newLines.join("\n");
        if (newBlock === value.slice(ls, le)) return;

        const newStart = Math.max(ls, start - removedFirst);
        const newEnd   = Math.max(newStart, end - removedUpToEnd);
        edit(ls, le, newBlock, newStart, newEnd);
        return;
    }

    if (start !== end && value.slice(start, end).includes("\n")) {
        const ls = value.lastIndexOf("\n", start - 1) + 1;
        let le = value.indexOf("\n", end);
        if (le === -1) le = value.length;

        const block = value.slice(ls, le);
        const newBlock = block.split("\n").map((l) => "    " + l).join("\n");
        const lineCount = block.split("\n").length;
        edit(ls, le, newBlock, start + 4, end + 4 * lineCount);
        return;
    }

    edit(start, end, "    ");
}

function handleEnterKey() {
    const start = codeEditor.selectionStart;
    const end   = codeEditor.selectionEnd;
    const value = codeEditor.value;
    const lineStart = value.lastIndexOf("\n", start - 1) + 1;
    const currentLine = value.slice(lineStart, start);
    const indent = (currentLine.match(/^[ \t]*/) || [""])[0];
    const extra  = /:\s*$/.test(currentLine) ? "    " : "";
    edit(start, end, "\n" + indent + extra);
}

/* =========================================================
   MULTI-FILE TABS
========================================================= */
function defaultFiles() {
    return [{ name: "main.py", code: DEFAULT_CODE }];
}

function sanitizeFileName(name) {
    name = String(name || "").trim();
    if (!name) return "";
    name = name.replace(/[\\/:*?"<>|]/g, "_");
    if (!/\.py$/i.test(name)) name += ".py";
    return name;
}

function loadFiles() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(FILES_KEY)); } catch (e) {}

    if (
        saved &&
        Array.isArray(saved.files) &&
        saved.files.length > 0 &&
        saved.files.every((f) => f && typeof f.name === "string" && typeof f.code === "string")
    ) {
        files = saved.files.slice(0, MAX_FILES);
        activeFileIndex = Math.min(Math.max(0, saved.active | 0), files.length - 1);
        return;
    }

    let legacy = null;
    try { legacy = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    files = [{ name: "main.py", code: typeof legacy === "string" ? legacy : DEFAULT_CODE }];
    activeFileIndex = 0;
}

let filesSaveTimer = null;
function persistFiles() {
    clearTimeout(filesSaveTimer);
    filesSaveTimer = setTimeout(() => {
        try {
            localStorage.setItem(
                FILES_KEY,
                JSON.stringify({ files: files, active: activeFileIndex })
            );
        } catch (e) {}
    }, 250);
}

function persistCurrentFile() {
    if (files[activeFileIndex]) files[activeFileIndex].code = codeEditor.value;
    persistFiles();
}

function flushFilesNow() {
    if (files[activeFileIndex]) files[activeFileIndex].code = codeEditor.value;
    try {
        localStorage.setItem(
            FILES_KEY,
            JSON.stringify({ files: files, active: activeFileIndex })
        );
    } catch (e) {}
}

window.addEventListener("pagehide", flushFilesNow);

function uniqueFileName() {
    let n = files.length + 1;
    let name = "file" + n + ".py";
    while (files.some((f) => f.name === name)) {
        n++;
        name = "file" + n + ".py";
    }
    return name;
}

function renderTabs() {
    fileTabs.innerHTML = "";

    files.forEach((f, idx) => {
        const tab = document.createElement("div");
        tab.className = "file-tab" + (idx === activeFileIndex ? " active" : "");
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", idx === activeFileIndex ? "true" : "false");
        tab.title = f.name;

        const nameSpan = document.createElement("span");
        nameSpan.className = "file-tab-name";
        nameSpan.textContent = f.name;
        tab.appendChild(nameSpan);

        if (files.length > 1) {
            const close = document.createElement("button");
            close.type = "button";
            close.className = "file-tab-close";
            close.textContent = "×";
            close.title = "Close " + f.name;
            close.setAttribute("aria-label", "Close " + f.name);
            close.addEventListener("click", (e) => {
                e.stopPropagation();
                closeFile(idx);
            });
            tab.appendChild(close);
        }

        tab.addEventListener("click", () => switchFile(idx));
        fileTabs.appendChild(tab);
    });

    const add = document.createElement("button");
    add.type = "button";
    add.className = "file-tab file-tab-add";
    add.textContent = "+";
    add.title = "New Python file";
    add.setAttribute("aria-label", "New Python file");
    add.addEventListener("click", addFile);
    fileTabs.appendChild(add);
}

function loadActiveFileIntoEditor() {
    codeEditor.value = files[activeFileIndex].code || "";
    errorLine = null;
    searchMatches = [];
    searchIndex = -1;
    searchCount.textContent = "0/0";
    updateLineNumbers();
    codeEditor.scrollTop = 0;
    codeEditor.scrollLeft = 0;
    syncScroll();
}

function switchFile(idx) {
    if (idx === activeFileIndex) return;
    if (idx < 0 || idx >= files.length) return;
    persistCurrentFile();
    activeFileIndex = idx;
    loadActiveFileIntoEditor();
    renderTabs();
    persistFiles();
    codeEditor.focus();
}

function addFile() {
    if (files.length >= MAX_FILES) {
        alert("You can open up to " + MAX_FILES + " files at once.");
        return;
    }
    persistCurrentFile();
    files.push({ name: uniqueFileName(), code: "" });
    activeFileIndex = files.length - 1;
    loadActiveFileIntoEditor();
    renderTabs();
    persistFiles();
    codeEditor.focus();
}

function closeFile(idx) {
    const f = files[idx];
    if (!f) return;

    if (
        f.code.trim() &&
        f.code !== DEFAULT_CODE &&
        !window.confirm(`Close "${f.name}"? Unsaved changes in this tab will be lost.`)
    ) {
        return;
    }

    files.splice(idx, 1);

    if (files.length === 0) {
        files = defaultFiles();
        activeFileIndex = 0;
    } else {
        if (idx < activeFileIndex) {
            activeFileIndex--;
        } else if (idx === activeFileIndex) {
            activeFileIndex = Math.min(idx, files.length - 1);
        }
    }

    loadActiveFileIntoEditor();
    renderTabs();
    persistFiles();
}

function renameCurrentFile() {
    const current = files[activeFileIndex];
    if (!current) return;
    const name = window.prompt("Rename program:", current.name);
    if (name === null) return;
    const clean = sanitizeFileName(name);
    if (!clean) return;
    if (files.some((f, i) => i !== activeFileIndex && f.name === clean)) {
        alert("A file with this name is already open.");
        return;
    }
    current.name = clean;
    renderTabs();
    persistFiles();
}

function clearProgram() {
    if (!codeEditor.value) return;
    edit(0, codeEditor.value.length, "");
}

function resetProgram() {
    replaceAll(DEFAULT_CODE);
}

async function copyProgramCode() {
    const text = codeEditor.value;
    if (!text) return;

    let ok = false;
    try {
        await navigator.clipboard.writeText(text);
        ok = true;
    } catch (e) {}

    if (!ok) {
        const selStart = codeEditor.selectionStart;
        const selEnd = codeEditor.selectionEnd;
        codeEditor.focus();
        codeEditor.select();
        try { ok = document.execCommand("copy"); } catch (e) {}
        codeEditor.setSelectionRange(selStart, selEnd);
    }

    menuCopyButton.textContent = ok ? "Copied!" : "Copy failed";
    setTimeout(() => { menuCopyButton.textContent = "Copy code"; }, 1200);
}

function saveProgram() {
    const current = files[activeFileIndex];
    const suggested = current ? current.name : "main.py";
    const name = window.prompt("Save as:", suggested);
    if (name === null) return;
    const clean = sanitizeFileName(name) || "main.py";

    const blob = new Blob([codeEditor.value], { type: "text/x-python;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = clean;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

openButton.addEventListener("click", () => openFileInput.click());
saveAsButton.addEventListener("click", saveProgram);
findButton.addEventListener("click", openSearch);

undoButton.addEventListener("click", () => {
    codeEditor.focus();
    try { document.execCommand("undo"); } catch (e) {}
    updateLineNumbers();
    persistCurrentFile();
});
redoButton.addEventListener("click", () => {
    codeEditor.focus();
    try { document.execCommand("redo"); } catch (e) {}
    updateLineNumbers();
    persistCurrentFile();
});

renameButton.addEventListener("click", renameCurrentFile);
copyCodeButton.addEventListener("click", copyProgramCode);
clearButton.addEventListener("click", clearProgram);
resetButton.addEventListener("click", resetProgram);

openFileInput.addEventListener("change", async () => {
    const file = openFileInput.files && openFileInput.files[0];
    openFileInput.value = "";
    if (!file) return;

    if (files.length >= MAX_FILES) {
        alert("Too many open files. Close a tab first.");
        return;
    }

    let text;
    try { text = await file.text(); } catch (e) {
        alert("Could not read the file.");
        return;
    }

    const existingIdx = files.findIndex((f) => f.name === file.name);
    if (existingIdx !== -1) {
        files[existingIdx].code = text;
        if (existingIdx === activeFileIndex) {
            loadActiveFileIntoEditor();
            renderTabs();
            persistFiles();
        } else {
            switchFile(existingIdx);
        }
    } else {
        persistCurrentFile();
        files.push({ name: file.name, code: text });
        activeFileIndex = files.length - 1;
        loadActiveFileIntoEditor();
        renderTabs();
        persistFiles();
    }
});

/* =========================================================
   FIND IN CODE
========================================================= */
function computeMatches() {
    searchMatches = [];
    const query = searchInput.value;
    if (!query) return;
    const t = codeEditor.value.toLowerCase();
    const q = query.toLowerCase();
    let idx = 0;
    while ((idx = t.indexOf(q, idx)) !== -1) {
        searchMatches.push([idx, idx + query.length]);
        idx += Math.max(1, query.length);
    }
}

function updateSearchCount() {
    searchCount.textContent = searchMatches.length
        ? (searchIndex + 1) + "/" + searchMatches.length
        : "0/0";
}

function scrollToOffset(offset) {
    const lh = parseFloat(getComputedStyle(codeEditor).lineHeight) || 22;
    const line = codeEditor.value.slice(0, offset).split("\n").length;
    codeEditor.scrollTop = Math.max(0, (line - 1) * lh - codeEditor.clientHeight / 3);
    syncScroll();
}

function goToMatch(i) {
    if (!searchMatches.length) { updateSearchCount(); return; }
    const n = searchMatches.length;
    searchIndex = ((i % n) + n) % n;
    const r = searchMatches[searchIndex];
    codeEditor.focus();
    codeEditor.setSelectionRange(r[0], r[1]);
    scrollToOffset(r[0]);
    updateSearchCount();
    refreshCursor();
}

function openSearch() {
    editorSearch.classList.add("open");
    computeMatches();
    searchIndex = searchMatches.length ? 0 : -1;
    updateSearchCount();
    searchInput.focus();
    searchInput.select();
}

function closeSearch() {
    editorSearch.classList.remove("open");
    searchMatches = [];
    searchIndex = -1;
    searchCount.textContent = "0/0";
    codeEditor.focus();
}

function refreshSearch() {
    computeMatches();
    if (searchIndex >= searchMatches.length) searchIndex = searchMatches.length ? 0 : -1;
    if (searchIndex === -1 && searchMatches.length) searchIndex = 0;
    updateSearchCount();
}

searchInput.addEventListener("input", refreshSearch);

searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        goToMatch(e.shiftKey ? searchIndex - 1 : searchIndex + 1);
    } else if (e.key === "Escape") {
        e.preventDefault();
        closeSearch();
    }
});

searchNext.addEventListener("click", () => goToMatch(searchIndex + 1));
searchPrev.addEventListener("click", () => goToMatch(searchIndex - 1));
searchClose.addEventListener("click", closeSearch);

/* =========================================================
   SEQUENTIAL INPUT() DETECTION & UI
========================================================= */
function extractInputPrompts() {
    const code = codeEditor.value;
    const prompts = [];
    const re = /\binput\s*\(/g;
    let m;
    while ((m = re.exec(code)) !== null) {
        const lineStart = code.lastIndexOf("\n", m.index - 1) + 1;
        if (code.slice(lineStart, m.index).includes("#")) continue;

        const lit = /\s*(?:"((?:[^"\\\n]|\\.)*)"|'((?:[^'\\\n]|\\.)*)')\s*\)/y;
        lit.lastIndex = re.lastIndex;
        const mm = lit.exec(code);
        let p = "";
        if (mm) p = mm[1] !== undefined ? mm[1] : mm[2];
        p = p.replace(/\\n/g, "\n").replace(/\\t/g, "\t");
        prompts.push(p);
    }
    return prompts;
}

function hasInputFunction() { return extractInputPrompts().length > 0; }

function renderNextPrompt() {
    if (currentPromptIndex >= promptsList.length) return;

    const prompt = promptsList[currentPromptIndex];
    const row = document.createElement("div");
    row.className = "input-row";

    const label = document.createElement("span");
    label.className = "input-prompt";
    label.textContent = prompt || `Input ${currentPromptIndex + 1}:`;
    label.title = label.textContent;

    const field = document.createElement("input");
    field.className = "input-field";
    field.type = "text";
    field.placeholder = "";
    field.setAttribute("aria-label", label.textContent);

    field.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            handleInputSubmit(field.value);
        }
    });

    row.appendChild(label);
    row.appendChild(field);
    inputBody.appendChild(row);
    inputBody.scrollTop = inputBody.scrollHeight;
    field.focus();
}

function resetExecutionInputState() {
    inputMode = false;
    promptsList = [];
    collectedInputs = [];
    currentPromptIndex = 0;
    lastPromptSig = "";
    errorLine = null;

    inputSection.classList.remove("visible");
    inputBody.innerHTML = "";
    inputStatus.textContent = "Waiting for input";
}

function startInputSequence() {
    promptsList = extractInputPrompts();
    if (promptsList.length === 0) {
        inputSection.classList.remove("visible");
        inputMode = false;
        return false;
    }

    collectedInputs = [];
    currentPromptIndex = 0;
    lastPromptSig = JSON.stringify(promptsList);

    inputBody.innerHTML = "";
    inputSection.classList.add("visible");
    inputMode = true;
    inputStatus.textContent = `Waiting for input 1 of ${promptsList.length}`;
    renderNextPrompt();
    return true;
}

function handleInputSubmit(value) {
    collectedInputs.push(value);

    const lastRow = inputBody.lastChild;
    const field = lastRow ? lastRow.querySelector(".input-field") : null;
    if (!field) return;

    const staticValue = document.createElement("span");
    staticValue.className = "input-history-value";
    staticValue.textContent = value;
    lastRow.replaceChild(staticValue, field);

    currentPromptIndex++;
    if (currentPromptIndex < promptsList.length) {
        inputStatus.textContent = `Waiting for input ${currentPromptIndex + 1} of ${promptsList.length}`;
        renderNextPrompt();
    } else {
        inputStatus.textContent = "All inputs received. Running...";
        executeCode();
    }
}

function syncInputRows() {
    if (!inputMode) return;
    const newPrompts = extractInputPrompts();
    const sig = JSON.stringify(newPrompts);
    if (sig === lastPromptSig) return;

    lastPromptSig = sig;
    startInputSequence();
}

function getUserInput() {
    return collectedInputs.join("\n");
}

function stripInputPrompts(text) {
    if (!text) return "";
    if (!inputMode) return text;

    let result = text;
    extractInputPrompts().forEach((prompt) => {
        if (prompt && prompt.length > 0) {
            const escaped = prompt.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            result = result.replace(new RegExp(escaped, "g"), "");
        }
    });
    return result;
}

/* =========================================================
   OUTPUT RENDERING + RUN / STOP
========================================================= */
let ansiRenderer = new AnsiTerminalRenderer();

function clearConsoleContent() {
    outputConsole.textContent = "";
}

function appendNode(node) {
    const ph = outputConsole.querySelector(".output-placeholder");
    if (ph) ph.remove();
    outputConsole.appendChild(node);
    outputConsole.scrollTop = outputConsole.scrollHeight;
}

function appendNote(text) {
    const div = document.createElement("div");
    div.className = "output-placeholder";
    div.textContent = text;
    appendNode(div);
}

function renderStdout(text) {
    const cleaned = inputMode ? stripInputPrompts(text) : text;
    if (!cleaned) return;
    appendNode(ansiRenderer.push(cleaned));
    appendNode(ansiRenderer.finish());
}

const TRACEBACK_FILE_RE = /^(\s*)File "([^"]*)", line (\d+)(.*)$/;

function renderTraceback(errText) {
    const block = document.createElement("div");
    block.className = "output-error";
    let lastErrLine = null;

    errText.split("\n").forEach((line) => {
        const m = line.match(TRACEBACK_FILE_RE);
        if (m) {
            const n = parseInt(m[3], 10);
            lastErrLine = n;

            const pre = document.createElement("span");
            pre.textContent = m[1] + 'File "' + m[2] + '", ';
            block.appendChild(pre);

            const link = document.createElement("span");
            link.className = "error-link";
            link.textContent = "line " + n;
            link.title = "Go to line " + n;
            link.addEventListener("click", () => goToLine(n));
            block.appendChild(link);

            const post = document.createElement("span");
            post.textContent = m[4] + "\n";
            block.appendChild(post);
        } else {
            block.appendChild(ansiRenderer.push(line));
            block.appendChild(document.createTextNode("\n"));
        }
    });

    appendNode(block);

    if (lastErrLine !== null) {
        errorLine = lastErrLine;
        renderGutter();
    }
}

function maybeOfferMoreInput(errText) {
    if (!errText.includes("EOFError")) return;

    promptsList.push("");
    currentPromptIndex = promptsList.length - 1;

    inputMode = true;
    inputSection.classList.add("visible");
    inputStatus.textContent = "Program needs more input";

    renderNextPrompt();
}

function runFlow() {
    if (running) return;

    resetExecutionInputState();
    renderGutter();
    resetOutput();
    setStatus("running", "Running");

    if (isMobile()) document.body.classList.add("shell-view");

    if (startInputSequence()) {
        setStatus("running", "Waiting for input");
        return;
    }

    executeCode();
}

async function executeCode() {
    if (running) return;
    running = true;

    errorLine = null;
    renderGutter();

    ansiRenderer = new AnsiTerminalRenderer();
    clearConsoleContent();

    runButton.classList.add("hidden");
    stopButton.classList.add("visible");
    setStatus("running", "Running…");

    abortCtrl = new AbortController();

    try {
        const resp = await fetch("/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                code: codeEditor.value,
                input: getUserInput(),
            }),
            signal: abortCtrl.signal,
        });

        let data = null;
        try { data = await resp.json(); } catch (e) {}

        if (!data) {
            renderServerError("Server error (HTTP " + resp.status + ").");
            setStatus("error", "Error");
            return;
        }

        renderResult(data);
    } catch (err) {
        if (err && err.name === "AbortError") {
            appendNote("Stopped. (The server may still finish this run in the background.)");
            setStatus("error", "Stopped");
            showOutputButtons();
        } else {
            renderServerError("Could not reach the server. Please check your connection and try again.");
            setStatus("error", "Error");
        }
    } finally {
        running = false;
        abortCtrl = null;
        stopButton.classList.remove("visible");
        runButton.classList.remove("hidden");
    }
}

function renderServerError(message) {
    clearConsoleContent();
    const div = document.createElement("div");
    div.className = "output-error";
    div.textContent = message;
    appendNode(div);
    showOutputButtons();
}

function renderResult(data) {
    if (data.output) renderStdout(data.output);

    const errText = (data.error || "").replace(/\s+$/, "");
    if (errText) {
        renderTraceback(errText);

        if (/timed out/i.test(errText)) setStatus("error", "Timed out");
        else setStatus("error", "Error");

        maybeOfferMoreInput(errText);
    } else {
        if (!data.output) appendNote("Program finished with no output.");
        setStatus("ready", "Finished");
    }

    showOutputButtons();
}

runButton.addEventListener("click", runFlow);

stopButton.addEventListener("click", () => {
    if (abortCtrl) abortCtrl.abort();
});

headerBackBtn.addEventListener("click", () => {
    // Leaving the shell also closes the package terminal.
    pkgLayer.classList.remove("open");
    document.body.classList.remove("shell-view");
});

copyButton.addEventListener("click", async () => {
    const text = outputConsole.innerText.replace(/\n$/, "");
    try {
        await navigator.clipboard.writeText(text);
        copyButton.textContent = "Copied!";
        setTimeout(() => { copyButton.textContent = "Copy"; }, 1200);
    } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (err) {}
        ta.remove();
    }
});

clearOutputBtn.addEventListener("click", resetOutput);

/* =========================================================
   INSTALLED LIBRARIES — simple list panel
   - Opens ONLY when "Installed Libraries" is clicked.
     (No hover-open.)
   - Clicking the item again closes it.
   - Also closes on: outside click, Esc, or when the menu closes.
========================================================= */
function libFlyoutIsOpen() {
    return libFlyout.classList.contains("open");
}

function openLibFlyout() {
    libFlyout.classList.add("open");
    menuLibrariesButton.classList.add("submenu-open");
    menuLibrariesButton.setAttribute("aria-expanded", "true");
    refreshLibraryList();
}

function closeLibFlyout() {
    libFlyout.classList.remove("open");
    menuLibrariesButton.classList.remove("submenu-open");
    menuLibrariesButton.setAttribute("aria-expanded", "false");
}

function maybeRefreshLibFlyout() {
    if (libFlyoutIsOpen()) refreshLibraryList();
}

/* Click toggles the list. */
menuLibrariesButton.addEventListener("click", (e) => {
    e.stopPropagation();
    if (libFlyoutIsOpen()) closeLibFlyout();
    else openLibFlyout();
});

/* Footer jumps straight into the package terminal */
libFlyoutOpenTerminal.addEventListener("click", () => {
    closeEditorMenu();
    if (isMobile()) document.body.classList.add("shell-view");
    pkgOpen();
});

async function refreshLibraryList() {
    libFlyoutList.textContent = "";
    libFlyoutCount.style.color = "";
    libFlyoutCount.textContent = "loading…";

    let pkgs = [];
    try {
        const r = await fetch("/packages");
        const d = await r.json();
        pkgs = (d && d.packages) || [];
    } catch (e) {
        libFlyoutCount.textContent = "could not load";
        libFlyoutCount.style.color = "#dc2626";
        return;
    }

    libFlyoutCount.textContent = pkgs.length ? String(pkgs.length) : "";

    if (!pkgs.length) {
        const empty = document.createElement("div");
        empty.className = "lib-empty";
        empty.textContent = "No libraries installed.";
        libFlyoutList.appendChild(empty);
        return;
    }

    pkgs.forEach((p) => {
        const row = document.createElement("div");
        row.className = "lib-row";

        const nm = document.createElement("span");
        nm.className = "lib-name";
        nm.textContent = p.name;
        nm.title = p.name;
        row.appendChild(nm);

        if (p.version) {
            const ver = document.createElement("span");
            ver.className = "lib-ver";
            ver.textContent = p.version;
            row.appendChild(ver);
        }

        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "lib-remove";
        rm.textContent = "×";
        rm.title = "Uninstall " + p.name;
        rm.setAttribute("aria-label", "Uninstall " + p.name);
        rm.addEventListener("click", () => uninstallFromFlyout(p.name, rm));
        row.appendChild(rm);

        libFlyoutList.appendChild(row);
    });
}

async function uninstallFromFlyout(name, button) {
    button.disabled = true;
    button.textContent = "…";

    let ok = false;
    let errMsg = "";
    try {
        const resp = await fetch("/packages/uninstall", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name }),
        });
        let d = null;
        try { d = await resp.json(); } catch (e) {}
        if (d && d.success) ok = true;
        else errMsg = (d && d.error) || "Uninstall failed.";
    } catch (e) {
        errMsg = "Could not reach the server.";
    }

    if (ok) {
        refreshLibraryList();
    } else {
        libFlyoutCount.style.color = "#dc2626";
        libFlyoutCount.textContent = errMsg;
        button.disabled = false;
        button.textContent = "×";
    }
}

/* =========================================================
   PACKAGE TERMINAL (desktop-style, replaces the shell panel)
========================================================= */
let pkgBusy = false;
let pkgHistory = [];
let pkgHistoryIdx = -1;

const PKG_HELP_TEXT =
`Available commands:
  install <package>      Install a package        e.g. install numpy
  install pkg==1.2.3     Install a pinned version e.g. install requests==2.31.0
  uninstall <package>    Remove a package (and its bundled dependencies)
  list                   Show installed packages
  clear                  Clear this terminal
  exit / quit            Close the terminal

Installed libraries are importable immediately in your code.
Tip: use ↑ / ↓ for command history.`;

function pkgPrint(text, cls) {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = text;
    pkgTerminal.appendChild(div);
    pkgTerminal.scrollTop = pkgTerminal.scrollHeight;
}

/* Echo a command with a colored shell prompt, like a real terminal */
function pkgEcho(cmd) {
    const div = document.createElement("div");

    const user = document.createElement("span");
    user.className = "p-user";
    user.textContent = "student@pyolympiad:";

    const path = document.createElement("span");
    path.className = "p-path";
    path.textContent = "~";

    const dollar = document.createElement("span");
    dollar.textContent = "$ ";

    const body = document.createElement("span");
    body.className = "t-cmd";
    body.textContent = cmd;

    div.appendChild(user);
    div.appendChild(path);
    div.appendChild(dollar);
    div.appendChild(body);

    pkgTerminal.appendChild(div);
    pkgTerminal.scrollTop = pkgTerminal.scrollHeight;
}

function pkgIsOpen() {
    return pkgLayer.classList.contains("open");
}

function pkgOpen() {
    pkgLayer.classList.add("open");
    if (!pkgTerminal.childElementCount) {
        pkgPrint("PyOlympiad 1.0.0 (Python 3) — package terminal", "t-dim");
        pkgPrint("Installed libraries are importable in every Run on this server session.", "t-dim");
        pkgPrint("Hosting is ephemeral — for permanent dependencies add them to requirements.txt.", "t-dim");
        pkgPrint("");
        pkgPrint("Type 'help' for available commands.", "t-dim");
        pkgPrint("");
    }
    setTimeout(() => pkgInput.focus(), 50);
}

function pkgClosePanel() {
    pkgLayer.classList.remove("open");
}

pkgExit.addEventListener("click", pkgClosePanel);
pkgDotClose.addEventListener("click", pkgClosePanel);
packagesButton.addEventListener("click", () => {
    if (pkgIsOpen()) pkgClosePanel();
    else pkgOpen();
});

function setPkgBusy(b) {
    pkgBusy = b;
    pkgRun.disabled = b;
    pkgInput.disabled = b;
}

async function pkgApi(path, body) {
    const resp = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
    });
    let data = null;
    try { data = await resp.json(); } catch (e) {}
    if (!data) data = { success: false, error: "Server error (HTTP " + resp.status + ")." };
    return data;
}

async function doPkgInstall(spec) {
    setPkgBusy(true);
    pkgPrint("Collecting " + spec + " … this may take up to a minute.", "t-dim");
    try {
        const d = await pkgApi("/packages/install", { name: spec });
        if (d.output) pkgPrint(d.output);
        if (d.success) {
            pkgPrint("✔ " + (d.message || ("Installed " + spec + ".")), "t-ok");
        } else {
            pkgPrint("✖ " + (d.error || "Install failed."), "t-err");
        }
    } catch (e) {
        pkgPrint("✖ Could not reach the server.", "t-err");
    } finally {
        setPkgBusy(false);
        maybeRefreshLibFlyout();
        pkgInput.focus();
    }
}

async function doPkgUninstall(name) {
    setPkgBusy(true);
    pkgPrint("Removing " + name + " …", "t-dim");
    try {
        const d = await pkgApi("/packages/uninstall", { name: name });
        if (d.success) {
            pkgPrint("✔ " + (d.message || ("Removed " + name + ".")), "t-ok");
        } else {
            pkgPrint("✖ " + (d.error || "Uninstall failed."), "t-err");
        }
    } catch (e) {
        pkgPrint("✖ Could not reach the server.", "t-err");
    } finally {
        setPkgBusy(false);
        maybeRefreshLibFlyout();
        pkgInput.focus();
    }
}

async function doPkgList() {
    setPkgBusy(true);
    try {
        const r = await fetch("/packages");
        const d = await r.json();
        const pkgs = (d && d.packages) || [];
        if (!pkgs.length) {
            pkgPrint("No packages installed.", "t-dim");
        } else {
            pkgPrint("Package              Version  Size");
            pkgPrint("-------------------  -------  --------");
            pkgs.forEach((p) => {
                const kb = Math.max(1, Math.round((p.size || 0) / 1024));
                pkgPrint(
                    (p.name + "                   ").slice(0, 20) + "  " +
                    ((p.version || "-") + "       ").slice(0, 7) + "  " +
                    kb + " KB"
                );
            });
        }
    } catch (e) {
        pkgPrint("✖ Could not reach the server.", "t-err");
    } finally {
        setPkgBusy(false);
        pkgInput.focus();
    }
}

function runPkgCommand(raw) {
    const line = String(raw || "").trim();
    if (!line) return;

    if (pkgBusy) {
        pkgPrint("Please wait for the current operation to finish.", "t-dim");
        return;
    }

    pkgEcho(line);

    const m = line.match(/^(?:pip3?\s+)?(install|uninstall|remove|add|list|ls|installed|help|clear|cls|exit|quit)\b\s*(.*)$/i);
    if (!m) {
        pkgPrint("bash: " + line.split(/\s+/)[0] + ": command not found — type 'help'.", "t-err");
        return;
    }

    const cmd = m[1].toLowerCase();
    const rest = m[2].trim();

    if (cmd === "help") {
        pkgPrint(PKG_HELP_TEXT, "t-dim");
        return;
    }
    if (cmd === "clear" || cmd === "cls") {
        pkgTerminal.textContent = "";
        return;
    }
    if (cmd === "exit" || cmd === "quit") {
        pkgPrint("logout", "t-dim");
        setTimeout(pkgClosePanel, 250);
        return;
    }
    if (cmd === "list" || cmd === "ls" || cmd === "installed") {
        doPkgList();
        return;
    }
    if (cmd === "install" || cmd === "add") {
        if (!rest) {
            pkgPrint("Usage: install <package>   e.g. install requests==2.31.0", "t-err");
            return;
        }
        doPkgInstall(rest.split(/\s+/)[0]);
        return;
    }
    if (cmd === "uninstall" || cmd === "remove") {
        if (!rest) {
            pkgPrint("Usage: uninstall <package>", "t-err");
            return;
        }
        doPkgUninstall(rest.split(/\s+/)[0].replace(/==.*$/, ""));
        return;
    }
}

pkgForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (pkgBusy) return;
    const v = pkgInput.value;
    if (v.trim()) {
        pkgHistory.push(v.trim());
        if (pkgHistory.length > 50) pkgHistory.shift();
        pkgHistoryIdx = pkgHistory.length;
    }
    pkgInput.value = "";
    runPkgCommand(v);
});

pkgInput.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") {
        if (!pkgHistory.length) return;
        e.preventDefault();
        pkgHistoryIdx = Math.max(0, pkgHistoryIdx - 1);
        pkgInput.value = pkgHistory[pkgHistoryIdx] || "";
    } else if (e.key === "ArrowDown") {
        if (!pkgHistory.length) return;
        e.preventDefault();
        pkgHistoryIdx = Math.min(pkgHistory.length, pkgHistoryIdx + 1);
        pkgInput.value = pkgHistory[pkgHistoryIdx] || "";
    }
});

/* =========================================================
   EDITOR MENU
========================================================= */
function closeEditorMenu() {
    editorMenuPanel.classList.remove("open");
    closeLibFlyout();   // the library list always closes with the menu
    menuButton.setAttribute("aria-expanded", "false");
}

menuButton.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !editorMenuPanel.classList.contains("open");
    closeLibFlyout();   // always start with the library list closed
    editorMenuPanel.classList.toggle("open", willOpen);
    menuButton.setAttribute("aria-expanded", willOpen ? "true" : "false");
});

document.addEventListener("click", (e) => {
    if (
        editorMenuPanel.classList.contains("open") &&
        !editorMenuPanel.contains(e.target) &&
        !menuButton.contains(e.target)
    ) {
        // The library list lives inside the panel, so clicking anywhere
        // outside closes both together.
        closeEditorMenu();
    }
});

menuRenameButton.addEventListener("click", () => { closeEditorMenu(); renameCurrentFile(); });
menuCopyButton.addEventListener("click", copyProgramCode);
menuClearButton.addEventListener("click", () => { closeEditorMenu(); clearProgram(); });
menuResetButton.addEventListener("click", () => { closeEditorMenu(); resetProgram(); });
menuFontDown.addEventListener("click", () => { fontSize -= 1; applyFont(); });
menuFontUp.addEventListener("click", () => { fontSize += 1; applyFont(); });

/* =========================================================
   EDITOR EVENT LISTENERS
========================================================= */
codeEditor.addEventListener("input", () => {
    updateLineNumbers();
    persistCurrentFile();
    if (editorSearch.classList.contains("open")) refreshSearch();
    if (inputMode && !running) syncInputRows();
});

codeEditor.addEventListener("scroll", syncScroll);
codeEditor.addEventListener("click", refreshCursor);
codeEditor.addEventListener("keyup", refreshCursor);

codeEditor.addEventListener("keydown", (e) => {
    if (e.isComposing) return;

    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        runFlow();
        return;
    }

    if (e.key === "Tab") {
        e.preventDefault();
        handleTabKey(e.shiftKey);
        return;
    }

    if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        handleEnterKey();
        return;
    }
});

/* =========================================================
   GLOBAL KEYBOARD SHORTCUTS
========================================================= */
document.addEventListener("keydown", (e) => {

    // While the package terminal is open, Escape closes it and
    // editor shortcuts are suppressed so typing stays in the terminal.
    if (pkgIsOpen()) {
        if (e.key === "Escape") {
            e.preventDefault();
            pkgClosePanel();
        }
        return;
    }

    const mod = e.ctrlKey || e.metaKey;

    if (mod && e.key === "Enter") {
        e.preventDefault();
        runFlow();
    } else if (mod && (e.key === "f" || e.key === "F")) {
        e.preventDefault();
        openSearch();
    } else if (mod && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        saveProgram();
    } else if (e.key === "Escape") {
        // Esc closes the library list first, then the search bar, then the menu.
        if (libFlyoutIsOpen()) {
            closeLibFlyout();
        } else if (editorSearch.classList.contains("open")) {
            closeSearch();
        } else {
            closeEditorMenu();
        }
    }
});

/* =========================================================
   INIT
========================================================= */
loadFiles();
loadActiveFileIntoEditor();
renderTabs();
applyFont();
relayoutRunControls();
applyLayout();
setStatus("ready", "Ready");
</script>
