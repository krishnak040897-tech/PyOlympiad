<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PyOlympiad | Kakatiya Olympiad School</title>
<link rel="icon" href="https://i.ibb.co/j9JrF3R5/Vibrant-Gradient-Ribbon-M-Logo.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --green: #10a37f;
    --green-dark: #0b8f70;
    --blue: #3776ab;
    --background: #f6f7f9;
    --white: #ffffff;
    --border: #e5e7eb;
    --border-light: #eeeeee;
    --text: #202124;
    --muted: #9ca3af;
    --error: #dc2626;
    --editor-background: #ffffff;
    --console-background: #fbfbfc;
    --header-height: 58px;
    --panel-header: 43px;
    --splitter: 10px;
    --code-font: 14px;
    --code-lh: 22px;
}

html, body { height: 100%; }

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
}
body.dragging { user-select: none; -webkit-user-select: none; }
body.dragging.col { cursor: col-resize; }
body.dragging.row { cursor: row-resize; }

/* ================= HEADER ================= */
.topbar {
    height: var(--header-height);
    flex-shrink: 0;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px;
    gap: 10px;
    position: relative; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-logo {
    width: 40px; height: 40px; flex-shrink: 0;
    object-fit: contain;
    background: none; border: none; border-radius: 0;
    display: block;
}
.brand-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-name { font-size: 16px; font-weight: 650; color: #202124; white-space: nowrap; }
.brand-subtitle { font-size: 11px; color: var(--muted); white-space: nowrap; }
.header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.header-back-button {
    display: none;
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    color: #374151;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
}
.header-back-button svg { width: 22px; height: 22px; }
.header-back-button:hover { background: #f0f0f0; }

.language {
    height: 34px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 7px; background: white;
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: #4b5563; white-space: nowrap;
}
.python-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }

.run-controls { display: flex; align-items: center; }
.run-icon { line-height: 1; }

.run-button, .stop-button {
    height: 36px; border: none; border-radius: 7px; color: white;
    padding: 0 17px; font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: 0.15s ease;
}
.run-button { background: var(--green); }
.run-button:hover { background: var(--green-dark); }
.run-button:disabled { opacity: 0.65; cursor: not-allowed; }
.stop-button { background: #ef4444; display: none; }
.stop-button:hover { background: #dc2626; }
.stop-button.visible { display: flex; }
.run-button.hidden { display: none; }

button:focus-visible, .splitter:focus-visible, .error-link:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
}

/* ================= WORKSPACE ================= */
.workspace {
    flex: 1; min-height: 0;
    display: flex; flex-direction: row;
    overflow: hidden;
}

/* ================= EDITOR ================= */
.editor-section {
    flex: 1 1 0;
    min-width: 0; min-height: 0;
    background: var(--editor-background);
    display: flex; flex-direction: column;
}
.editor-toolbar {
    height: var(--panel-header); flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 13px; gap: 10px;
}
.file-name { color: #374151; font-size: 13px; flex-shrink: 0; }
.toolbar-buttons {
    display: flex; gap: 7px; min-width: 0;
    overflow-x: auto; scrollbar-width: none;
}
.toolbar-buttons::-webkit-scrollbar { display: none; }
.toolbar-buttons > * { flex-shrink: 0; }

.tool-button {
    height: 29px; border: 1px solid var(--border); border-radius: 6px;
    background: white; padding: 0 10px; font-size: 12px; color: #6b7280;
    cursor: pointer; transition: 0.15s; white-space: nowrap;
    font-family: inherit;
}
.tool-button:hover { background: #f7f7f8; color: #374151; }
.font-buttons { display: flex; gap: 4px; }
.font-buttons .tool-button { width: 30px; padding: 0; font-weight: 600; }
.lbl-short { display: none; }

.editor-container { flex: 1; min-height: 0; overflow: hidden; position: relative; }
.editor {
    position: absolute; inset: 0;
    display: flex; overflow: hidden;
    font-family: "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: var(--code-font); line-height: var(--code-lh);
}
.line-numbers {
    width: 54px; flex-shrink: 0; padding-top: 14px;
    background: #fafafa; border-right: 1px solid #eeeeee;
    color: #9ca3af; text-align: right; padding-right: 13px; padding-bottom: 14px;
    user-select: none; overflow: hidden;
}
.line-number { height: var(--code-lh); font-size: calc(var(--code-font) - 1px); }
.line-number.current { color: #374151; font-weight: 600; }
.line-number.error { color: var(--error); font-weight: 700; }
.line-number.error::before { content: "● "; font-size: 8px; vertical-align: middle; }

.code-area { flex: 1; min-width: 0; position: relative; }

#highlightLayer,
#codeEditor {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    margin: 0;
    padding: 14px 18px;
    border: none; outline: none;
    font-family: "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: var(--code-font);
    line-height: var(--code-lh);
    letter-spacing: normal;
    tab-size: 4;
    white-space: pre;
    word-wrap: normal;
    overflow: auto;
}
#highlightLayer {
    background: white;
    color: #1f2937;
    pointer-events: none;
    scrollbar-width: none;
}
#highlightLayer::-webkit-scrollbar { display: none; }
#highlightLayer code {
    font: inherit; background: none; padding: 0; margin: 0;
    white-space: inherit; display: block; text-shadow: none;
}
#codeEditor {
    resize: none;
    background: transparent;
    color: transparent;
    caret-color: #111827;
}
#codeEditor::selection { background: rgba(16, 163, 127, 0.22); }
#codeEditor::placeholder { color: #b4b8bd; }

.token.comment                       { color: #8b949e; font-style: italic; }
.token.string, .token.triple-quoted-string,
.token.char                          { color: #0a7d5a; }
.token.number, .token.boolean        { color: #c2410c; }
.token.keyword                       { color: #7c3aed; font-weight: 500; }
.token.builtin, .token.class-name    { color: #0369a1; }
.token.function                      { color: #2563eb; }
.token.decorator, .token.annotation  { color: #b45309; }
.token.operator, .token.punctuation  { color: #4b5563; }
.token.interpolation .token.interpolation-punctuation { color: #c2410c; }

/* Show operators exactly as typed (>= stays >=, not a single "≥" ligature) */
.editor, #highlightLayer, #highlightLayer code, #codeEditor, .output-console, .input-field, .input-prompt {
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "calt" 0, "clig" 0;
    -webkit-font-feature-settings: "liga" 0, "calt" 0, "clig" 0;
}

.editor-status {
    height: 30px; flex-shrink: 0;
    border-top: 1px solid var(--border); background: white;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; color: #8a8f98; font-size: 11px; gap: 10px;
    white-space: nowrap; overflow: hidden;
}
.status-group { display: flex; align-items: center; gap: 12px; }

/* ================= SPLITTER ================= */
.splitter {
    flex: 0 0 var(--splitter);
    background: var(--border-light);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    cursor: col-resize;
    position: relative;
    touch-action: none;
    z-index: 5;
    transition: background 0.15s;
}
.splitter::before { content: ""; position: absolute; inset: 0 -7px; }
.splitter::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 3px; height: 28px;
    transform: translate(-50%, -50%);
    border-radius: 2px; background: #c4c9d0;
}
.splitter:hover, .splitter.active { background: rgba(16, 163, 127, 0.18); }
.splitter:hover::after, .splitter.active::after { background: var(--green); }

/* ================= RIGHT SECTION (SHELL) ================= */
.right-section {
    flex: 0 0 38%;
    min-width: 0; min-height: 0;
    background: var(--console-background);
    display: flex; flex-direction: column;
    overflow: hidden;
}

.input-section {
    display: none; background: white;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    max-height: 50%;
    flex-direction: column;
}
.input-section.visible { display: flex; }
.input-header {
    height: 42px; flex-shrink: 0;
    border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
}
.input-header-right { display: flex; align-items: center; gap: 10px; }
.input-title { font-size: 13px; font-weight: 600; color: #374151; }
.input-status { font-size: 11px; color: #f59e0b; }
.input-body { padding: 12px 14px 14px; overflow-y: auto; min-height: 0; }
.input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.input-row:last-child { margin-bottom: 0; }
.input-prompt {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: #374151; max-width: 55%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.input-history-value {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: #0a7d5a; /* matches string color */
    flex: 1; min-width: 80px; height: 32px;
    display: flex; align-items: center; padding: 0 9px;
}
.input-field {
    flex: 1; min-width: 80px; height: 32px;
    border: 1px solid #d8dce1; border-radius: 6px; outline: none;
    padding: 0 9px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; color: #202124; background: white;
}
.input-field:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.10);
}

.output-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.output-header {
    height: var(--panel-header); flex-shrink: 0; background: white;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 14px; gap: 8px;
}
.output-title { font-size: 13px; font-weight: 600; color: #374151; }
.output-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.output-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9ca3af; white-space: nowrap; }
.small-button {
    height: 26px; border: 1px solid var(--border); border-radius: 5px;
    background: white; padding: 0 9px; font-size: 11px; color: #6b7280;
    cursor: pointer; display: none; transition: 0.15s; white-space: nowrap;
}
.small-button.visible { display: inline-block; }
.small-button:hover { background: #f7f7f8; color: #374151; }
.collapse-button { display: none; width: 28px; padding: 0; font-size: 12px; }

.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; }
.status-dot.ready   { background: #22c55e; }
.status-dot.running { background: #f59e0b; }
.status-dot.error   { background: #ef4444; }

.output-console {
    flex: 1; min-height: 0; overflow: auto; padding: 15px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 21px; color: #374151;
    white-space: pre-wrap; word-break: break-word;
}
.output-placeholder { color: #a1a7af; font-family: Inter, Arial, sans-serif; font-size: 12px; }
.output-error { color: var(--error); white-space: pre-wrap; }
.error-link { color: #b91c1c; text-decoration: underline; cursor: pointer; font-weight: 600; }
.error-link:hover { color: #7f1d1d; }

.right-section.collapsed .output-console,
.right-section.collapsed .input-section { display: none; }

/* ================= TABLET / MOBILE: DEDICATED SHELL SCREEN ================= */
@media (max-width: 850px) {
    .workspace { flex-direction: column; }
    .editor-section { width: 100%; flex: 1 1 0; min-height: 0; display: flex; }
    .splitter { display: none; }
    .right-section { display: none; width: 100%; flex: 1 1 0; background: var(--console-background); }
    
    /* Activate Shell View */
    body.shell-view .header-back-button { display: flex; }
    body.shell-view .editor-section { display: none; }
    body.shell-view .right-section { display: flex; flex-direction: column; }
    body.shell-view .run-controls { display: none; } 
    
    .input-section.visible { max-height: 40%; flex-shrink: 0; }
    .input-body { max-height: 28vh; }
    .output-section { flex: 1 1 0; min-height: 0; }
}

/* ================= SMALL PHONES ================= */
@media (max-width: 600px) {
    :root { --header-height: 52px; }
    .topbar { padding: 0 11px; }
    .brand-subtitle { font-size: 10px; }
    .brand-name { font-size: 15px; }
    .brand-logo { width: 34px; height: 34px; }
    .language { height: 30px; padding: 0 10px; font-size: 11px; }
    .editor-toolbar { padding: 0 10px; }
    .font-buttons { display: none; }
    .lbl-full { display: none; }
    .lbl-short { display: inline; }
    .line-numbers { width: 40px; padding-right: 8px; padding-bottom: 96px; }
    #highlightLayer, #codeEditor { padding: 14px 10px 96px; }   /* room so the last lines scroll above the round button */

    /* Round floating Run / Stop button (bottom-right of the editor) */
    .editor-section { position: relative; }
    .run-controls {
        position: absolute; right: 16px; bottom: 46px; z-index: 20;
    }
    .run-button, .stop-button {
        width: 58px; height: 58px; padding: 0;
        border-radius: 50%;
        box-shadow: 0 6px 16px rgba(16, 163, 127, 0.45), 0 2px 5px rgba(0, 0, 0, 0.18);
    }
    .stop-button { box-shadow: 0 6px 16px rgba(239, 68, 68, 0.45), 0 2px 5px rgba(0, 0, 0, 0.18); }
    .run-button #runButtonText, .stop-button .run-label { display: none; }
    .run-icon { font-size: 22px; }
    .run-button .run-icon { padding-left: 3px; }   /* optical centring of the triangle */
    .run-button:active, .stop-button:active { transform: scale(0.93); }
    .right-section { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .editor-status .hide-sm { display: none; }
    .output-console { padding: 12px; }
    .output-status #statusText { display: none; }
}
@media (max-width: 380px) {
    .brand-name { font-size: 14px; }
    .brand { gap: 8px; }
    .tool-button { padding: 0 8px; }
}

/* ================= SHORT LANDSCAPE SCREENS ================= */
@media (max-height: 480px) and (max-width: 850px) {
    :root { --header-height: 46px; --panel-header: 36px; }
    .editor-status { display: none; }
}

/* ================= TOUCH DEVICES ================= */
@media (pointer: coarse) {
    .input-field { font-size: 16px; height: 38px; }
    .input-history-value { font-size: 16px; height: 38px; }
    .tool-button, .small-button { height: 34px; }
    .collapse-button { width: 34px; }
    :root { --splitter: 14px; }
}

@media (max-width: 600px) and (max-height: 480px) {
    .run-controls { bottom: 16px; }
    .run-button, .stop-button { width: 48px; height: 48px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <img class="brand-logo" src="https://i.ibb.co/j9JrF3R5/Vibrant-Gradient-Ribbon-M-Logo.png" alt="PyOlympiad logo">
        <div class="brand-info">
            <div class="brand-name">PyOlympiad</div>
            <div class="brand-subtitle">Kakatiya Olympiad School</div>
        </div>
    </div>
    <div class="header-right">
        <button id="headerBackButton" class="header-back-button" title="Back to editor" aria-label="Back to editor">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <div class="language">
            <span class="python-dot"></span>
            Python 3
        </div>
        <div class="run-controls" id="runControls">
            <button class="run-button" id="runButton" title="Run (Ctrl+Enter)" aria-label="Run code">
                <span class="run-icon">▶</span>
                <span id="runButtonText">Run</span>
            </button>
            <button class="stop-button" id="stopButton" title="Stop" aria-label="Stop running">
                <span class="run-icon">■</span>
                <span class="run-label">Stop</span>
            </button>
        </div>
    </div>
</header>

<main class="workspace" id="workspace">

    <section class="editor-section" id="editorSection">
        <div class="editor-toolbar">
            <div class="file-name">main.py</div>
            <div class="toolbar-buttons">
                <div class="font-buttons">
                    <button class="tool-button" id="fontDown" title="Smaller text" aria-label="Decrease font size">A−</button>
                    <button class="tool-button" id="fontUp" title="Larger text" aria-label="Increase font size">A+</button>
                </div>
                <button class="tool-button" id="copyCodeButton" title="Copy code">Copy</button>
                <button class="tool-button" id="downloadButton" title="Download main.py" aria-label="Download main.py">
                    <span class="lbl-full">Download</span><span class="lbl-short">⬇</span>
                </button>
                <button class="tool-button" id="clearButton" title="Clear the editor (Ctrl+Z to undo)">Clear</button>
                <button class="tool-button" id="resetButton" title="Restore the starter code (Ctrl+Z to undo)">Reset</button>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor">
                <div class="line-numbers" id="lineNumbers"></div>
                <div class="code-area">
                    <pre id="highlightLayer" aria-hidden="true"><code id="highlightCode" class="language-python"></code></pre>
                    <textarea
                        id="codeEditor"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        aria-label="Python code editor"
                        placeholder="# Write your Python code here..."
                    ></textarea>
                </div>
            </div>
        </div>

        <div class="editor-status">
            <div class="status-group">
                <span id="cursorPosition">Ln 1, Col 1</span>
                <span class="hide-sm">Spaces: 4</span>
            </div>
            <div class="status-group">
                <span id="charCount">0 characters</span>
                <span class="hide-sm">Python 3</span>
            </div>
        </div>
    </section>

    <div class="splitter" id="splitter"
         role="separator" tabindex="0"
         aria-label="Resize output panel"
         aria-orientation="vertical"
         title="Drag to resize · Double-click to reset"></div>

    <section class="right-section" id="rightSection">
        <div class="input-section" id="inputSection">
            <div class="input-header">
                <span class="input-title">Program Input</span>
                <div class="input-header-right">
                    <span class="input-status" id="inputStatus">Waiting for input</span>
                </div>
            </div>
            <div class="input-body" id="inputBody"></div>
        </div>

        <div class="output-section">
            <div class="output-header">
                <span class="output-title">Shell Output</span>
                <div class="output-actions">
                    <button class="small-button" id="copyButton">Copy</button>
                    <button class="small-button" id="clearOutputButton">Clear</button>
                    <span class="output-status">
                        <span class="status-dot ready" id="statusDot"></span>
                        <span id="statusText">Ready</span>
                    </span>
                    <button class="small-button collapse-button visible" id="collapseButton"
                            aria-label="Collapse output" title="Collapse / expand output">▾</button>
                </div>
            </div>
            <div class="output-console" id="outputConsole" role="log" aria-live="polite">
                <div class="output-placeholder">
                    Click Run to execute your Python program.
                </div>
            </div>
        </div>
    </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

<script>
/* ELEMENTS */
const root            = document.documentElement;
const workspace       = document.getElementById("workspace");
const rightSection    = document.getElementById("rightSection");
const editorSection   = document.getElementById("editorSection");
const splitter        = document.getElementById("splitter");
const codeEditor      = document.getElementById("codeEditor");
const highlightLayer  = document.getElementById("highlightLayer");
const highlightCode   = document.getElementById("highlightCode");
const lineNumbers     = document.getElementById("lineNumbers");
const runButton       = document.getElementById("runButton");
const stopButton      = document.getElementById("stopButton");
const clearButton     = document.getElementById("clearButton");
const resetButton     = document.getElementById("resetButton");
const fontDown        = document.getElementById("fontDown");
const fontUp          = document.getElementById("fontUp");
const copyCodeButton  = document.getElementById("copyCodeButton");
const downloadButton  = document.getElementById("downloadButton");
const inputSection    = document.getElementById("inputSection");
const inputBody       = document.getElementById("inputBody");
const inputStatus     = document.getElementById("inputStatus");
const outputConsole   = document.getElementById("outputConsole");
const statusDot       = document.getElementById("statusDot");
const statusText      = document.getElementById("statusText");
const cursorPosition  = document.getElementById("cursorPosition");
const charCount       = document.getElementById("charCount");
const copyButton      = document.getElementById("copyButton");
const clearOutputBtn  = document.getElementById("clearOutputButton");
const collapseButton  = document.getElementById("collapseButton");
const headerBackBtn   = document.getElementById("headerBackButton");

const DEFAULT_CODE =
`name = input("Enter your name: ")
print("Hello", name)`;

const STORAGE_KEY = "python_editor_code_v1";
const LAYOUT_KEY  = "python_editor_layout_v1";
const FONT_KEY    = "python_editor_font_v1";
const EMPTY_OUTPUT_HTML =
    `<div class="output-placeholder">Click Run to execute your Python program.</div>`;

const isCoarse = window.matchMedia("(pointer: coarse)").matches;

/* STATE */
let inputMode = false;
let running   = false;
let abortCtrl = null;
let errorLine = null;

/* Sequential Input State */
let promptsList = [];
let collectedInputs = [];
let currentPromptIndex = 0;
let lastPromptSig = "";

/* =========================================================
   RESIZABLE LAYOUT (Desktop only)
========================================================= */
const mobileQuery = window.matchMedia("(max-width: 850px)");
const DEFAULT_LAYOUT = { desk: 0.38, mob: 0.40, collapsed: false };
let layout = Object.assign({}, DEFAULT_LAYOUT);

try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY));
    if (saved && typeof saved === "object") Object.assign(layout, saved);
} catch (e) {}

function saveLayout() {
    try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) {}
}
function isMobile() { return mobileQuery.matches; }

function limits(total) {
    const mobile   = isMobile();
    const minRight = mobile ? 120 : 260;
    const minLeft  = mobile ? 140 : 320;
    const sp = splitter.getBoundingClientRect()[mobile ? "height" : "width"] || 10;
    let maxRight = total - minLeft - sp;
    if (maxRight < minRight) maxRight = minRight;
    return { minRight, maxRight };
}

function applyLayout() {
    const rect   = workspace.getBoundingClientRect();
    const mobile = isMobile();
    
    if (mobile) {
        // Mobile doesn't use the splitter layout, it uses view switching
        rightSection.style.flex = "";
        splitter.style.flex = "";
        editorSection.style.flex = "";
        return;
    }

    const total  = rect.width;
    const header = parseFloat(getComputedStyle(root).getPropertyValue("--panel-header")) || 43;

    splitter.setAttribute("aria-orientation", "vertical");

    if (layout.collapsed) {
        rightSection.classList.add("collapsed");
        rightSection.style.flex = `0 0 ${header}px`;
        collapseButton.textContent = "▴";
        collapseButton.setAttribute("aria-label", "Expand output");
        return;
    }

    rightSection.classList.remove("collapsed");
    collapseButton.textContent = "▾";
    collapseButton.setAttribute("aria-label", "Collapse output");

    const { minRight, maxRight } = limits(total);
    const frac = layout.desk;
    const px = Math.min(Math.max(frac * total, minRight), maxRight);

    rightSection.style.flex = `0 0 ${px}px`;
    splitter.setAttribute("aria-valuenow", Math.round((px / total) * 100));
}

function setRightSize(px) {
    if (isMobile()) return;
    const rect   = workspace.getBoundingClientRect();
    const total  = rect.width;
    const { minRight, maxRight } = limits(total);
    px = Math.min(Math.max(px, minRight), maxRight);
    layout.desk = px / total;
    applyLayout();
}

function setCollapsed(value) {
    if (isMobile()) return;
    layout.collapsed = value;
    applyLayout();
    saveLayout();
}

let dragging = false;

splitter.addEventListener("pointerdown", (e) => {
    if (isMobile()) return;
    dragging = true;
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add("active");
    document.body.classList.add("dragging", "col");
    e.preventDefault();
});

splitter.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = workspace.getBoundingClientRect();
    const sp   = splitter.getBoundingClientRect();
    setRightSize(rect.right - e.clientX - sp.width / 2);
});

function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { splitter.releasePointerCapture(e.pointerId); } catch (err) {}
    splitter.classList.remove("active");
    document.body.classList.remove("dragging", "col");
    saveLayout();
}
splitter.addEventListener("pointerup", endDrag);
splitter.addEventListener("pointercancel", endDrag);

splitter.addEventListener("dblclick", () => {
    if (isMobile()) return;
    layout = Object.assign({}, DEFAULT_LAYOUT);
    applyLayout();
    saveLayout();
});

splitter.addEventListener("keydown", (e) => {
    if (isMobile()) return;
    const rect   = workspace.getBoundingClientRect();
    const total  = rect.width;
    const current = rightSection.getBoundingClientRect().width;
    const step = total * 0.03;
    let handled = true;

    if (e.key === "ArrowLeft")       setRightSize(current + step);
    else if (e.key === "ArrowRight") setRightSize(current - step);
    else handled = false;
    
    if (e.key === "Home" || e.key === "Enter") {
        layout = Object.assign({}, DEFAULT_LAYOUT);
        applyLayout();
        handled = true;
    }
    if (handled) { e.preventDefault(); saveLayout(); }
});

collapseButton.addEventListener("click", () => setCollapsed(!layout.collapsed));
window.addEventListener("resize", applyLayout);
window.addEventListener("orientationchange", () => setTimeout(applyLayout, 150));
if (mobileQuery.addEventListener) mobileQuery.addEventListener("change", applyLayout);

/* =========================================================
   FONT SIZE
========================================================= */
const FONT_MIN = isCoarse ? 16 : 11;
const FONT_MAX = 26;
let fontSize = isCoarse ? 16 : 14;
try {
    const f = parseInt(localStorage.getItem(FONT_KEY), 10);
    if (f) fontSize = f;
} catch (e) {}

function applyFont() {
    fontSize = Math.min(Math.max(fontSize, FONT_MIN), FONT_MAX);
    root.style.setProperty("--code-font", fontSize + "px");
    root.style.setProperty("--code-lh", Math.round(fontSize * 1.6) + "px");
    try { localStorage.setItem(FONT_KEY, String(fontSize)); } catch (e) {}
    syncScroll();
}
fontDown.addEventListener("click", () => { fontSize -= 1; applyFont(); });
fontUp.addEventListener("click",   () => { fontSize += 1; applyFont(); });

/* =========================================================
   SYNTAX HIGHLIGHTING + GUTTER
========================================================= */
function syncScroll() {
    highlightLayer.scrollTop  = codeEditor.scrollTop;
    highlightLayer.scrollLeft = codeEditor.scrollLeft;
    lineNumbers.scrollTop     = codeEditor.scrollTop;
}

function updateHighlight() {
    let text = codeEditor.value;
    if (text.endsWith("\n")) text += " ";
    highlightCode.textContent = text;
    if (window.Prism) Prism.highlightElement(highlightCode);
    syncScroll();
}

function getCurrentLineNumber() {
    return codeEditor.value.substring(0, codeEditor.selectionStart).split("\n").length;
}

let gutterKey = "";
function renderGutter() {
    const total = codeEditor.value.split("\n").length;
    const cur   = getCurrentLineNumber();
    const key   = total + "|" + cur + "|" + errorLine;
    if (key === gutterKey) return;
    gutterKey = key;

    let html = "";
    for (let i = 1; i <= total; i++) {
        let cls = "line-number";
        if (i === errorLine) cls += " error";
        else if (i === cur)  cls += " current";
        html += `<div class="${cls}">${i}</div>`;
    }
    lineNumbers.innerHTML = html;
    lineNumbers.scrollTop = codeEditor.scrollTop;
}

function updateCursor() {
    const before = codeEditor.value.substring(0, codeEditor.selectionStart);
    const lines  = before.split("\n");
    cursorPosition.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
    const count = codeEditor.value.length;
    charCount.textContent = `${count} character${count === 1 ? "" : "s"}`;
}

function refreshCursor() { renderGutter(); updateCursor(); }

function updateLineNumbers() {
    updateHighlight();
    renderGutter();
    updateCursor();
}

function goToLine(n) {
    const lines = codeEditor.value.split("\n");
    if (n < 1 || n > lines.length) return;
    let start = 0;
    for (let i = 0; i < n - 1; i++) start += lines[i].length + 1;
    const end = start + lines[n - 1].length;
    codeEditor.focus();
    codeEditor.setSelectionRange(start, end);
    const lh = parseFloat(getComputedStyle(codeEditor).lineHeight) || 22;
    codeEditor.scrollTop = Math.max(0, (n - 1) * lh - codeEditor.clientHeight / 3);
    syncScroll();
    refreshCursor();
}

/* =========================================================
   EDIT HELPER (keeps Ctrl+Z / Ctrl+Y working)
========================================================= */
function edit(start, end, text, selStart, selEnd) {
    codeEditor.focus();
    codeEditor.setSelectionRange(start, end);
    let ok = false;
    try {
        if (text === "") {
            if (start === end) return;
            ok = document.execCommand("delete");
        } else {
            ok = document.execCommand("insertText", false, text);
        }
    } catch (e) {}
    if (!ok) {
        codeEditor.setRangeText(text, start, end, "end");
        codeEditor.dispatchEvent(new Event("input", { bubbles: true }));
    }
    if (selStart === undefined) selStart = start + text.length;
    if (selEnd === undefined)   selEnd = selStart;
    codeEditor.setSelectionRange(selStart, selEnd);
    refreshCursor();
}

/* Replace the whole document (undo-able on desktop; no keyboard pop-up on touch) */
function replaceAll(text) {
    if (isCoarse) {
        codeEditor.value = text;
        codeEditor.dispatchEvent(new Event("input", { bubbles: true }));
        codeEditor.scrollTop = 0;
    } else {
        if (codeEditor.value === "" && text === "") return;
        if (codeEditor.value === "") {
            edit(0, 0, text);
        } else if (text === "") {
            edit(0, codeEditor.value.length, "");
        } else {
            edit(0, codeEditor.value.length, text);
        }
        codeEditor.setSelectionRange(0, 0);
        codeEditor.scrollTop = 0;
    }
    syncScroll();
    refreshCursor();
}

/* =========================================================
   SEQUENTIAL INPUT() DETECTION & UI
========================================================= */
function extractInputPrompts() {
    const code = codeEditor.value;
    const prompts = [];
    const re = /\binput\s*\(/g;
    let m;
    while ((m = re.exec(code)) !== null) {
        const lineStart = code.lastIndexOf("\n", m.index - 1) + 1;
        if (code.slice(lineStart, m.index).includes("#")) continue;   // commented out

        const lit = /\s*(?:"((?:[^"\\\n]|\\.)*)"|'((?:[^'\\\n]|\\.)*)')\s*\)/y;
        lit.lastIndex = re.lastIndex;
        const mm = lit.exec(code);
        let p = "";
        if (mm) p = mm[1] !== undefined ? mm[1] : mm[2];
        p = p.replace(/\\n/g, "\n").replace(/\\t/g, "\t");
        prompts.push(p);
    }
    return prompts;
}

function hasInputFunction() { return extractInputPrompts().length > 0; }

function renderNextPrompt() {
    if (currentPromptIndex >= promptsList.length) return;

    const prompt = promptsList[currentPromptIndex];
    const row = document.createElement("div");
    row.className = "input-row";

    const label = document.createElement("span");
    label.className = "input-prompt";
    label.textContent = prompt || `Input ${currentPromptIndex + 1}:`;
    label.title = label.textContent;

    const field = document.createElement("input");
    field.className = "input-field";
    field.type = "text";
    /* No placeholder: the input box stays completely blank. The prompt
       text (e.g. "Enter number") is shown beside it by the label above. */
    field.setAttribute("aria-label", label.textContent);

    field.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            handleInputSubmit(field.value);
        }
    });

    row.appendChild(label);
    row.appendChild(field);
    inputBody.appendChild(row);
    inputBody.scrollTop = inputBody.scrollHeight;
    field.focus();
}

function resetExecutionInputState() {
    // Every Run starts with a completely new input/execution session.
    // Do not carry over any values, queue entries, indexes, or prompt state.
    inputMode = false;
    promptsList = [];
    collectedInputs = [];
    currentPromptIndex = 0;
    lastPromptSig = "";
    errorLine = null;

    inputSection.classList.remove("visible");
    inputBody.innerHTML = "";
    inputStatus.textContent = "Waiting for input";
}

function startInputSequence() {
    // startInputSequence is also safe to call independently; always rebuild
    // the sequential input UI from the current editor contents.
    promptsList = extractInputPrompts();
    if (promptsList.length === 0) {
        inputSection.classList.remove("visible");
        inputMode = false;
        return false;
    }

    collectedInputs = [];
    currentPromptIndex = 0;
    lastPromptSig = JSON.stringify(promptsList);

    inputBody.innerHTML = "";
    inputSection.classList.add("visible");
    inputMode = true;
    inputStatus.textContent = `Waiting for input 1 of ${promptsList.length}`;
    renderNextPrompt();
    return true;
}

function handleInputSubmit(value) {
    collectedInputs.push(value);

    // Convert the last input field to static text to preserve history
    const lastRow = inputBody.lastChild;
    const field = lastRow.querySelector(".input-field");
    const staticValue = document.createElement("span");
    staticValue.className = "input-history-value";
    staticValue.textContent = value;
    lastRow.replaceChild(staticValue, field);

    currentPromptIndex++;
    if (currentPromptIndex < promptsList.length) {
        inputStatus.textContent = `Waiting for input ${currentPromptIndex + 1} of ${promptsList.length}`;
        renderNextPrompt();
    } else {
        inputStatus.textContent = "All inputs received. Running...";
        executeCode();
    }
}

/* Keep typed values while the code is edited (restarts sequential input if prompts change) */
function syncInputRows() {
    if (!inputMode) return;
    const newPrompts = extractInputPrompts();
    const sig = JSON.stringify(newPrompts);
    if (sig === lastPromptSig) return;

    lastPromptSig = sig;
    startInputSequence();
}

function getUserInput() {
    return collectedInputs.join("\n");
}

/* Python's input("prompt") echoes the prompt to stdout; remove it from the output */
function stripInputPrompts(text) {
    if (!text) return "";
    if (!inputMode) return text;

    let result = text;
    extractInputPrompts().forEach((prompt) => {
        if (prompt && prompt.length > 0) {
            const escaped = prompt.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            result = result.replace(new RegExp(escaped, "g"), "");
        }
    });
    return result;
}

/*
 * ANSI / SGR terminal renderer.
 *
 * The parser is deliberately stateful: push() may receive an arbitrary
 * chunk and keeps an incomplete ESC[... sequence until the next chunk.
 * This keeps the renderer safe for streamed/chunked terminal data even
 * though the current /run endpoint returns one JSON response.
 *
 * Normal output is ALWAYS inserted with createTextNode/textContent.
 * Only spans created by this renderer receive styles, so stdout/stderr
 * cannot inject HTML into the Shell Output.
 */
class AnsiTerminalRenderer {
    constructor() {
        this.buffer = "";
        this.state = {
            bold: false,
            italic: false,
            underline: false,
            foreground: null,
            background: null,
        };
    }

    push(chunk) {
        if (chunk === null || chunk === undefined) return document.createDocumentFragment();
        this.buffer += String(chunk);
        return this._parse(false);
    }

    finish() {
        return this._parse(true);
    }

    _parse(flush) {
        const frag = document.createDocumentFragment();
        let text = "";

        const emitText = () => {
            if (!text) return;
            if (this._hasStyle()) {
                const span = document.createElement("span");
                span.style.cssText = this._styleText();
                span.textContent = text;
                frag.appendChild(span);
            } else {
                frag.appendChild(document.createTextNode(text));
            }
            text = "";
        };

        const source = this.buffer;
        let i = 0;

        while (i < source.length) {
            const ch = source[i];

            if (ch !== "\x1b") {
                text += ch;
                i++;
                continue;
            }

            // ESC[ ... final-byte is a CSI sequence. Keep incomplete data
            // for the next chunk instead of displaying it as raw text.
            if (i + 1 >= source.length) {
                if (!flush) break;
                i++;
                continue;
            }

            if (source[i + 1] !== "[") {
                // Unknown ANSI escape: consume the ESC itself, but preserve
                // the following printable character as normal terminal text.
                i++;
                continue;
            }

            let j = i + 2;
            while (j < source.length && !(source.charCodeAt(j) >= 0x40 && source.charCodeAt(j) <= 0x7e)) {
                j++;
            }

            if (j >= source.length) {
                if (!flush) break;
                // Incomplete sequence at the end of the final chunk: do not
                // leak its control syntax into the Shell Output.
                i = source.length;
                continue;
            }

            const finalByte = source[j];
            const paramsText = source.slice(i + 2, j);
            emitText();

            if (finalByte === "m") {
                this._applySgr(paramsText);
            }

            i = j + 1;
        }

        if (flush || i > 0) {
            this.buffer = source.slice(i);
        }
        emitText();
        return frag;
    }

    _applySgr(paramsText) {
        let params;
        if (paramsText === "" || paramsText === ";") {
            params = [0];
        } else {
            params = paramsText.split(";").map(v => v === "" ? 0 : Number(v));
        }

        for (let i = 0; i < params.length; i++) {
            const code = params[i];
            if (!Number.isFinite(code)) continue;

            if (code === 0) {
                this.state.bold = false;
                this.state.italic = false;
                this.state.underline = false;
                this.state.foreground = null;
                this.state.background = null;
            } else if (code === 1) {
                this.state.bold = true;
            } else if (code === 22) {
                this.state.bold = false;
            } else if (code === 3) {
                this.state.italic = true;
            } else if (code === 23) {
                this.state.italic = false;
            } else if (code === 4) {
                this.state.underline = true;
            } else if (code === 24) {
                this.state.underline = false;
            } else if (code === 39) {
                this.state.foreground = null;
            } else if (code === 49) {
                this.state.background = null;
            } else if (code >= 30 && code <= 37) {
                this.state.foreground = ANSI_COLORS[code - 30];
            } else if (code >= 40 && code <= 47) {
                this.state.background = ANSI_COLORS[code - 40];
            } else if (code >= 90 && code <= 97) {
                this.state.foreground = ANSI_BRIGHT_COLORS[code - 90];
            } else if (code >= 100 && code <= 107) {
                this.state.background = ANSI_BRIGHT_COLORS[code - 100];
            } else if (code === 38 || code === 48) {
                const isBackground = code === 48;
                const mode = params[i + 1];

                if (mode === 5 && Number.isFinite(params[i + 2])) {
                    const color = ansi256Color(params[i + 2]);
                    if (isBackground) this.state.background = color;
                    else this.state.foreground = color;
                    i += 2;
                } else if (mode === 2 && params.length >= i + 5 &&
                           params.slice(i + 2, i + 5).every(Number.isFinite)) {
                    const color = `rgb(${params[i + 2]}, ${params[i + 3]}, ${params[i + 4]})`;
                    if (isBackground) this.state.background = color;
                    else this.state.foreground = color;
                    i += 4;
                }
            }
        }
    }

    _hasStyle() {
        return this.state.bold || this.state.italic || this.state.underline ||
               !!this.state.foreground || !!this.state.background;
    }

    _styleText() {
        const styles = [];
        if (this.state.foreground) styles.push(`color:${this.state.foreground}`);
        if (this.state.background) styles.push(`background-color:${this.state.background}`);
        if (this.state.bold) styles.push("font-weight:700");
        if (this.state.italic) styles.push("font-style:italic");
        if (this.state.underline) styles.push("text-decoration:underline");
        return styles.join(";");
    }
}

const ANSI_COLORS = [
    "#000000", "#cd3131", "#0dbc79", "#e5e510",
    "#2472c8", "#bc3fbc", "#11a8cd", "#e5e5e5"
];

const ANSI_BRIGHT_COLORS = [
    "#666666", "#f14c4c", "#23d18b", "#f5f543",
    "#3b8eea", "#d670d6", "#29b8db", "#ffffff"
];

function ansi256Color(n) {
    n = Math.max(0, Math.min(255, Number(n) || 0));
    if (n < 8) return ANSI_COLORS[n];
    if (n < 16) return ANSI_BRIGHT_COLORS[n - 8];
    if (n >= 232) {
        const v = 8 + (n - 232) * 10;
        return `rgb(${v}, ${v}, ${v})`;
    }
    const index = n - 16;
    const r = Math.floor(index / 36);
    const g = Math.floor((index % 36) / 6);
    const b = index % 6;
    const level = [0, 95, 135, 175, 215, 255];
    return `rgb(${level[r]}, ${level[g]}, ${level[b]})`;
}

function renderAnsiText(text) {
    const renderer = new AnsiTerminalRenderer();
    const frag = renderer.push(text || "");
    const tail = renderer.finish();
    frag.appendChild(tail);
    return frag;
}

/*
 * Render a traceback with ANSI styling while preserving the existing
 * clickable "File \"main.py\", line N" behavior.
 */
function renderErrorText(text) {
    const root = document.createDocumentFragment();
    const styled = renderAnsiText(text || "");
    const walker = document.createTreeWalker(styled, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let node;
    while ((node = walker.nextNode())) nodes.push(node);

    const re = /(File "main\.py", )(line (\d+))/g;
    let lastLine = null;

    nodes.forEach((textNode) => {
        const value = textNode.nodeValue || "";
        re.lastIndex = 0;
        if (!re.test(value)) return;
        re.lastIndex = 0;

        const replacement = document.createDocumentFragment();
        let last = 0;
        let m;
        while ((m = re.exec(value)) !== null) {
            if (m.index > last) replacement.appendChild(document.createTextNode(value.slice(last, m.index + m[1].length)));
            else replacement.appendChild(document.createTextNode(m[1]));

            const a = document.createElement("a");
            a.href = "#";
            a.className = "error-link";
            a.textContent = m[2];
            a.dataset.line = m[3];
            a.title = "Go to this line";
            replacement.appendChild(a);
            last = m.index + m[0].length;
            lastLine = parseInt(m[3], 10);
        }
        if (last < value.length) replacement.appendChild(document.createTextNode(value.slice(last)));
        textNode.parentNode.replaceChild(replacement, textNode);
    });

    while (styled.firstChild) root.appendChild(styled.firstChild);
    return { frag: root, lastLine };
}

/* Render terminal output safely; stdout and stderr use the same ANSI path. */
function renderShellOutput(container, text) {
    container.replaceChildren();
    const renderer = new AnsiTerminalRenderer();
    container.appendChild(renderer.push(text || ""));
    container.appendChild(renderer.finish());
    return renderer;
}


function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
        document.body.removeChild(ta);
        if (ok) resolve();
        else reject(new Error("Copy failed"));
    });
}

/* =========================================================
   RUN / EXECUTE
========================================================= */
function setRunningUI(value) {
    running = value;
    runButton.disabled = value;
    if (value) {
        stopButton.classList.add("visible");
        runButton.classList.add("hidden");
    } else {
        stopButton.classList.remove("visible");
        runButton.classList.remove("hidden");
    }
}

function showShellView() {
    if (isMobile()) document.body.classList.add("shell-view");
}

function renderRunResult(data) {
    outputConsole.replaceChildren();
    showOutputButtons();

    const outputText = stripInputPrompts(data.output || "");

    if (outputText) {
        renderShellOutput(outputConsole, outputText);
    }

    if (data.success) {
        if (!outputText) {
            const p = document.createElement("div");
            p.className = "output-placeholder";
            p.textContent = "Program finished with no output.";
            outputConsole.appendChild(p);
        }
        setStatus("ready", "Finished");
    } else {
        const errDiv = document.createElement("div");
        errDiv.className = "output-error";
        const { frag, lastLine } = renderErrorText(data.error || "Program terminated with an error.");
        errDiv.appendChild(frag);
        outputConsole.appendChild(errDiv);
        if (lastLine) {
            errorLine = lastLine;
            renderGutter();
        }
        setStatus("error", "Error");
    }

    outputConsole.scrollTop = outputConsole.scrollHeight;
}

async function executeCode() {
    if (running) return;

    const code = codeEditor.value;
    if (!code.trim()) {
        resetExecutionInputState();
        outputConsole.replaceChildren();
        const errDiv = document.createElement("div");
        errDiv.className = "output-error";
        errDiv.textContent = "Please enter some Python code first.";
        outputConsole.appendChild(errDiv);
        showOutputButtons();
        setStatus("error", "No code");
        return;
    }

    const userInput = getUserInput();

    running = true;
    abortCtrl = new AbortController();
    setRunningUI(true);
    setStatus("running", "Running...");

    try {
        const resp = await fetch("/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: code, input: userInput }),
            signal: abortCtrl.signal
        });
        const data = await resp.json();
        renderRunResult(data);
    } catch (err) {
        outputConsole.replaceChildren();
        const errDiv = document.createElement("div");
        errDiv.className = "output-error";
        if (err && err.name === "AbortError") {
            errDiv.textContent = "Execution stopped.";
            setStatus("ready", "Stopped");
        } else {
            errDiv.textContent = "Could not reach the server. Please check your connection and try again.";
            setStatus("error", "Network error");
        }
        outputConsole.appendChild(errDiv);
        showOutputButtons();
    } finally {
        setRunningUI(false);
        abortCtrl = null;
        inputMode = false;
    }
}

function startRun() {
    if (running) return;

    errorLine = null;
    renderGutter();
    resetExecutionInputState();
    outputConsole.replaceChildren();
    showShellView();

    // If the program contains input() calls, collect them sequentially first.
    if (startInputSequence()) {
        setStatus("running", "Waiting for input");
        return;
    }

    executeCode();
}

runButton.addEventListener("click", startRun);
stopButton.addEventListener("click", () => {
    if (abortCtrl) abortCtrl.abort();
});

/* =========================================================
   OUTPUT BUTTONS + ERROR LINKS
========================================================= */
copyButton.addEventListener("click", () => {
    copyText(outputConsole.innerText).then(() => {
        const old = copyButton.textContent;
        copyButton.textContent = "Copied";
        setTimeout(() => { copyButton.textContent = old; }, 1200);
    }).catch(() => {});
});

clearOutputBtn.addEventListener("click", resetOutput);

outputConsole.addEventListener("click", (e) => {
    const link = e.target.closest(".error-link");
    if (!link) return;
    e.preventDefault();
    const n = parseInt(link.dataset.line, 10);
    if (n) goToLine(n);
});

/* =========================================================
   EDITOR TOOLBAR BUTTONS
========================================================= */
copyCodeButton.addEventListener("click", () => {
    copyText(codeEditor.value).then(() => {
        const old = copyCodeButton.textContent;
        copyCodeButton.textContent = "Copied!";
        setTimeout(() => { copyCodeButton.textContent = old; }, 1200);
    }).catch(() => {});
});

downloadButton.addEventListener("click", () => {
    const blob = new Blob([codeEditor.value], { type: "text/x-python" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "main.py";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
});

clearButton.addEventListener("click", () => {
    resetExecutionInputState();
    replaceAll("");
    resetOutput();
});

resetButton.addEventListener("click", () => {
    resetExecutionInputState();
    replaceAll(DEFAULT_CODE);
});

/* =========================================================
   MOBILE SHELL VIEW BACK BUTTON
========================================================= */
headerBackBtn.addEventListener("click", () => {
    document.body.classList.remove("shell-view");
});

/* =========================================================
   EDITOR EVENTS
========================================================= */
let saveTimer = null;
function saveCode() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        try { localStorage.setItem(STORAGE_KEY, codeEditor.value); } catch (e) {}
    }, 300);
}

function loadCode() {
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    codeEditor.value = (typeof saved === "string") ? saved : DEFAULT_CODE;
}

codeEditor.addEventListener("input", () => {
    updateLineNumbers();
    syncInputRows();
    saveCode();
});

codeEditor.addEventListener("scroll", syncScroll);
codeEditor.addEventListener("click", refreshCursor);
codeEditor.addEventListener("keyup", refreshCursor);

codeEditor.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        startRun();
        return;
    }
    if (e.key === "Tab") {
        e.preventDefault();
        const s  = codeEditor.selectionStart;
        const en = codeEditor.selectionEnd;
        edit(s, en, "    ");
    }
});

window.addEventListener("beforeunload", () => {
    try { localStorage.setItem(STORAGE_KEY, codeEditor.value); } catch (e) {}
});

/* =========================================================
   INIT
========================================================= */
loadCode();
applyFont();
updateLineNumbers();
applyLayout();
setStatus("ready", "Ready");
</script>
</body>
</html>
